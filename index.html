<style>
  :root{
    --asphalt:#121415; --asphalt-2:#1B1E20; --asphalt-3:#242829; --asphalt-4:#2E3335;
    --chalk:#EDEFEF; --mist:#8B9296; --mist-dim:#5C6366;
    --hivis:#D6FF3F; --hivis-dim:rgba(214,255,63,.14);
    --clay:#C06A2E; --clay-dim:rgba(192,106,46,.16);
    --danger:#FF6B5D; --danger-dim:rgba(255,107,93,.15);
    --radius:20px; --radius-sm:13px;
    --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--asphalt); height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif; color:var(--chalk); overscroll-behavior-y:none;}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3,p{margin:0;}
  button,input,select{font-family:inherit;}
  ::selection{background:var(--hivis); color:var(--asphalt);}

  #app{max-width:480px; margin:0 auto; min-height:100dvh; position:relative;
    background:radial-gradient(60% 40% at 50% 0%, rgba(214,255,63,.06), transparent 60%), var(--asphalt);
    display:flex; flex-direction:column;}

  .pulse-strip{width:100%; height:34px; overflow:hidden; opacity:.55;}
  .pulse-strip svg{width:200%; height:100%; animation:pulseScroll 5.5s linear infinite;}
  @keyframes pulseScroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.25;}}
  @media (prefers-reduced-motion:reduce){ .pulse-strip svg{animation:none;} }

  #splash{position:fixed; inset:0; z-index:60; background:var(--asphalt); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:32px; max-width:480px; margin:0 auto;}
  #splash .word{font-size:60px; line-height:.9;}
  #splash .word span{color:var(--hivis);}
  #splash .tag{color:var(--mist); margin-top:10px; font-size:15px;}
  #splash .pulse-strip{margin:28px 0; max-width:280px;}
  .lang-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:28px;}
  .lang-pill{padding:8px 13px; border-radius:999px; border:1.5px solid var(--asphalt-4); background:var(--asphalt-2);
    color:var(--mist); font-size:12px; font-weight:700; cursor:pointer;}
  .lang-pill.active{border-color:var(--hivis); color:var(--hivis); background:var(--hivis-dim);}

  .overlay{position:fixed; inset:0; z-index:50; background:var(--asphalt); max-width:480px; margin:0 auto;
    overflow-y:auto; display:none; padding:calc(28px + var(--safe-top)) 24px calc(28px + var(--safe-bottom));}
  .overlay h2{font-size:28px;}
  .overlay .lead{color:var(--mist); margin-top:6px; font-size:14px; line-height:1.5;}
  .field{margin-top:20px;}
  .field label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--mist);
    margin-bottom:8px; font-weight:600;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=email],.field select{
    width:100%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--chalk);
    padding:13px 15px; border-radius:var(--radius-sm); font-size:16px; outline:none;}
  .field input:focus,.field select:focus{border-color:var(--hivis);}
  .choice-row{display:flex; gap:8px; flex-wrap:wrap;}
  .choice{flex:1; min-width:80px; text-align:center; padding:11px 6px; border-radius:var(--radius-sm);
    border:1.5px solid var(--asphalt-4); background:var(--asphalt-2); color:var(--mist);
    font-size:12.5px; font-weight:600; cursor:pointer; user-select:none;}
  .choice.active{border-color:var(--hivis); color:var(--hivis); background:var(--hivis-dim);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .divider-or{display:flex; align-items:center; gap:10px; margin:20px 0; color:var(--mist-dim);
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em;}
  .divider-or::before,.divider-or::after{content:''; flex:1; height:1px; background:var(--asphalt-3);}

  .btn{border:none; border-radius:999px; padding:15px 22px; font-weight:700; font-size:15px; cursor:pointer;
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary{background:var(--hivis); color:var(--asphalt);}
  .btn-primary:active{transform:scale(.98);}
  .btn-outline{background:transparent; border:1.5px solid var(--asphalt-4); color:var(--chalk);}
  .btn-danger{background:var(--danger-dim); color:var(--danger);}
  .btn-sm{padding:10px 16px; font-size:13.5px; width:auto;}
  .btn-disabled{background:var(--asphalt-2); color:var(--mist-dim); border:1.5px solid var(--asphalt-4);
    cursor:not-allowed; position:relative; margin-top:10px;}
  .soon-tag{position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:9px;
    text-transform:uppercase; letter-spacing:.05em; background:var(--asphalt-3); padding:3px 7px; border-radius:6px;}
  .soon-note{font-size:12px; color:var(--mist-dim); text-align:center; margin-top:10px; line-height:1.5;}
  .err-text{color:var(--danger); font-size:12.5px; margin-top:8px; display:none;}

  header.top{padding:calc(16px + var(--safe-top)) 20px 14px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5; background:linear-gradient(var(--asphalt) 70%, transparent);}
  header.top .brand{display:flex; align-items:center; gap:9px;}
  header.top .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--hivis); box-shadow:0 0 10px var(--hivis);}
  header.top .brand span{font-size:15px; font-weight:800;}

  .view{display:none; padding:4px 20px 112px;}
  .view.active{display:block;}

  .card{background:var(--asphalt-2); border-radius:var(--radius); padding:18px; margin-bottom:14px; border:1px solid rgba(255,255,255,.03);}
  .card h3{font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--mist); font-weight:700; margin-bottom:10px;}
  .muted{color:var(--mist); font-size:13.5px; line-height:1.5;}

  .tag{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:4px 9px; border-radius:999px;}
  .tag-asfalto{background:var(--asphalt-4); color:var(--chalk);}
  .tag-trail{background:var(--clay-dim); color:var(--clay);}
  .tag-mixto{background:var(--hivis-dim); color:var(--hivis);}
  .tag-soon{background:var(--asphalt-3); color:var(--mist-dim); border:1px dashed var(--asphalt-4);}

  .zone-chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px;}
  .zone-1{background:rgba(91,155,255,.16); color:#5B9BFF;}
  .zone-2{background:rgba(74,222,128,.16); color:#4ADE80;}
  .zone-3{background:rgba(250,204,21,.16); color:#FACC15;}
  .zone-4{background:rgba(251,146,60,.16); color:#FB923C;}
  .zone-5{background:rgba(255,107,93,.16); color:#FF6B5D;}
  .zone-badge-live{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-radius:var(--radius-sm); margin-bottom:12px; background:var(--asphalt-2);}
  .zone-badge-live.zone-1{background:rgba(91,155,255,.13);}
  .zone-badge-live.zone-2{background:rgba(74,222,128,.13);}
  .zone-badge-live.zone-3{background:rgba(250,204,21,.13);}
  .zone-badge-live.zone-4{background:rgba(251,146,60,.13);}
  .zone-badge-live.zone-5{background:rgba(255,107,93,.13);}
  .zone-badge-live .zn{font-size:19px; font-weight:800;}

  .greeting{font-size:25px; margin:10px 0 3px;}
  .next-session{display:flex; justify-content:space-between; align-items:flex-start;}
  .next-session .big{font-size:42px; line-height:.95;}
  .stat-row{display:flex; gap:10px;}
  .stat-box{flex:1; background:var(--asphalt-3); border-radius:var(--radius-sm); padding:12px; text-align:center;}
  .stat-box .n{font-size:21px; font-weight:800;}
  .stat-box .l{font-size:10px; color:var(--mist); text-transform:uppercase; letter-spacing:.05em;}
  .week-bars{display:flex; align-items:flex-end; gap:6px; height:70px; margin-top:14px;}
  .week-bars .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .week-bars .bar{width:100%; border-radius:5px 5px 0 0; background:var(--asphalt-4);}
  .week-bars .bar.rest-day{background:transparent; border:1px dashed var(--asphalt-4); height:4px !important;}
  .week-bars .bar.hivis{background:var(--hivis);}
  .week-bars .lbl{font-size:9.5px; color:var(--mist); margin-top:6px;}
  .coach-snippet{display:flex; gap:12px; align-items:flex-start;}
  .coach-avatar{width:38px; height:38px; border-radius:50%; background:var(--hivis-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  .day-row{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--asphalt-3); cursor:pointer;}
  .day-row:last-child{border-bottom:none;}
  .day-badge{width:42px; text-align:center; flex-shrink:0;}
  .day-badge .d{font-size:11px; color:var(--mist); text-transform:uppercase;}
  .day-info{flex:1; min-width:0;}
  .day-info .t{font-weight:700; font-size:14px;}
  .day-info .m{font-size:12px; color:var(--mist); margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .day-dist{font-family:'JetBrains Mono',monospace; font-size:14.5px; font-weight:700; color:var(--hivis); flex-shrink:0;}
  .day-detail{display:none; padding:0 0 14px 54px; font-size:13px; color:var(--mist); line-height:1.7;}
  .day-detail.open{display:block;}

  #runIdle{text-align:center; padding-top:16px;}
  .go-circle{width:165px; height:165px; border-radius:50%; margin:22px auto; background:var(--hivis);
    display:flex; align-items:center; justify-content:center; flex-direction:column; color:var(--asphalt); border:none; cursor:pointer;}
  .go-circle .display{font-size:25px;}
  .go-circle:active{transform:scale(.97);}
  #runActive,#runSummary{display:none;}
  .rec-dot{width:9px; height:9px; border-radius:50%; background:var(--danger); animation:blink 1.4s ease-in-out infinite; display:inline-block; margin-right:7px;}
  .timer-big{font-size:48px; text-align:center; margin:10px 0 14px;}
  .map-wrap{position:relative; isolation:isolate; height:260px; border-radius:var(--radius); overflow:hidden; margin-bottom:14px; border:1px solid var(--asphalt-4);}
  #liveMap{height:100%; width:100%; background:var(--asphalt-3);}
  .map-recenter-btn{position:absolute; bottom:12px; right:12px; z-index:10; width:40px; height:40px; border-radius:50%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--hivis); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .run-controls{display:flex; gap:10px; margin-top:16px;}

  #chatLog{display:flex; flex-direction:column; gap:10px; padding-bottom:10px;}
  .msg{max-width:82%; padding:11px 14px; border-radius:16px; font-size:14px; line-height:1.5;}
  .msg.coach{background:var(--asphalt-2); align-self:flex-start; border-bottom-left-radius:4px; white-space:pre-wrap;}
  .msg.user{background:var(--hivis); color:var(--asphalt); align-self:flex-end; border-bottom-right-radius:4px; font-weight:600;}
  .msg.system{align-self:center; background:none; color:var(--hivis); font-size:11.5px; text-align:center; max-width:100%; font-weight:700;}
  .typing span{display:inline-block; width:6px; height:6px; background:var(--mist); border-radius:50%; margin-right:3px; animation:blink 1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  .chat-input-bar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:var(--asphalt);
    padding:10px 16px calc(14px + var(--safe-bottom)); display:none; gap:8px; border-top:1px solid var(--asphalt-3); z-index:25; transition:bottom .15s ease;}
  .chat-input-bar.active{display:flex;}
  .chat-input-bar input{flex:1; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--chalk); padding:13px 16px; border-radius:999px; font-size:15px; outline:none;}
  .chat-input-bar input:focus{border-color:var(--hivis);}
  .chat-send{background:var(--hivis); color:var(--asphalt); border:none; width:44px; height:44px; border-radius:50%; flex-shrink:0; font-size:18px; cursor:pointer;}

  .day-picker{display:flex; flex-wrap:wrap; gap:8px;}
  .day-pill{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--asphalt-4); background:var(--asphalt-2); color:var(--mist); font-size:11px; font-weight:700; cursor:pointer; user-select:none; flex-shrink:0;}
  .day-pill.active{border-color:var(--hivis); color:var(--hivis); background:var(--hivis-dim);}

  .hist-card{margin-bottom:12px;}
  .hist-top{display:flex; justify-content:space-between; align-items:baseline;}
  .hist-date{font-size:12px; color:var(--mist);}
  .hist-route{width:100%; height:104px; background:var(--asphalt-3); border-radius:var(--radius-sm); margin:10px 0;}
  .hist-hrlist{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}

  .profile-head{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
  .avatar-big{width:54px; height:54px; border-radius:50%; background:var(--hivis-dim); color:var(--hivis); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:21px; flex-shrink:0;}
  .shoe-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--asphalt-3);}
  .shoe-item:last-child{border-bottom:none;}
  .shoe-icon{width:36px; height:36px; border-radius:11px; background:var(--asphalt-3); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .shoe-info{flex:1;}
  .shoe-info .n{font-weight:700; font-size:13.5px;}
  .wearbar{height:6px; background:var(--asphalt-3); border-radius:99px; margin-top:6px; overflow:hidden;}
  .wearbar > div{height:100%; background:var(--hivis);}
  .wearbar.warn > div{background:var(--danger);}
  .conn-item{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--asphalt-3);}
  .conn-item:last-child{border-bottom:none;}
  .conn-item .n{font-size:13.5px; font-weight:600;}
  .zone-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--asphalt-3);}
  .zone-row:last-child{border-bottom:none;}
  .zone-row .zd{font-size:11px; color:var(--mist-dim); margin-top:2px;}
  .small-link{color:var(--mist); font-size:12.5px; text-decoration:underline; background:none; border:none; cursor:pointer; padding:0;}
  .add-row{display:flex; gap:8px; margin-top:12px;}
  .add-row input,.add-row select{flex:1; background:var(--asphalt-3); border:1.5px solid var(--asphalt-4); color:var(--chalk); padding:11px; border-radius:var(--radius-sm); font-size:14px;}

  nav.tabbar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:rgba(27,30,32,.92);
    backdrop-filter:blur(14px); display:flex; padding:8px 3px calc(8px + var(--safe-bottom)); border-top:1px solid var(--asphalt-3); z-index:20;}
  nav.tabbar button{flex:1; background:none; border:none; color:var(--mist-dim); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:9px; font-weight:600; cursor:pointer; padding:3px;}
  nav.tabbar button svg{width:19px; height:19px;}
  nav.tabbar button.active{color:var(--hivis);}

  .elev-divider{display:flex; align-items:center; gap:8px; margin:22px 0 14px; color:var(--mist-dim);}
  .elev-divider svg{width:60px; height:14px; flex-shrink:0;}
  .elev-divider span{font-size:11px; text-transform:uppercase; letter-spacing:.07em;}
  .elev-divider::after{content:''; flex:1; height:1px; background:var(--asphalt-3);}
</style>
</head>
<body>
<div id="app">

  <div id="splash">
    <div class="pulse-strip"><svg viewBox="0 0 300 40" preserveAspectRatio="none"><path d="M0 20 H40 L48 6 L58 34 L66 20 H90 L98 8 L108 32 L116 20 H150 H190 L198 6 L208 34 L216 20 H240 L248 8 L258 32 L266 20 H300 L308 6 L318 34 L326 20 H350 H390 L398 6 L408 34 L416 20 H440 L448 8 L458 32 L466 20 H500 L508 6 L518 34 L526 20 H600" fill="none" stroke="#D6FF3F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
    <h1 class="display word">ZANC<span>A</span>DA</h1>
    <p class="tag" data-i18n="app_tag"></p>
    <div style="margin-top:34px; width:100%; max-width:280px;">
      <div class="lang-row" id="lang-row-splash"></div>
      <button class="btn btn-primary" data-i18n="start" onclick="goLogin()"></button>
    </div>
  </div>

  <div class="overlay" id="login">
    <h2 class="display" data-i18n="login_title"></h2>
    <p class="lead" data-i18n="login_lead_signin"></p>
    <div class="field">
      <label data-i18n="login_email_label"></label>
      <input type="email" id="login-email" data-i18n-ph="login_email_ph">
    </div>
    <div class="field">
      <label data-i18n="login_password_label"></label>
      <input type="password" id="login-password" data-i18n-ph="login_password_ph">
      <p class="err-text" id="login-err"></p>
    </div>
    <div class="field"><button class="btn btn-primary" data-i18n="login_continue" onclick="handleSignIn()"></button></div>
    <button class="small-link" style="display:block; text-align:center; width:100%; margin-top:14px;" onclick="handleForgotPassword()" data-i18n="login_forgot"></button>
    <div class="divider-or"><span data-i18n="login_or"></span></div>
    <button class="btn btn-disabled" onclick="showSoonNote()"><span data-i18n="login_google"></span><span class="soon-tag" data-i18n="login_soon"></span></button>
    <p class="soon-note" id="soon-note" style="display:none;" data-i18n="login_soon_note"></p>
    <button class="small-link" style="display:block; text-align:center; width:100%; margin-top:18px;" onclick="goSignup()" data-i18n="login_go_signup"></button>
  </div>

  <div class="overlay" id="signup" style="display:none;">
    <h2 class="display" data-i18n="signup_title"></h2>
    <p class="lead" data-i18n="signup_lead"></p>
    <div class="field">
      <label data-i18n="login_email_label"></label>
      <input type="email" id="signup-email" data-i18n-ph="login_email_ph">
    </div>
    <div class="field">
      <label data-i18n="login_password_label"></label>
      <input type="password" id="signup-password" data-i18n-ph="login_password_ph">
      <p class="err-text" id="signup-err"></p>
    </div>
    <div class="field"><button class="btn btn-primary" data-i18n="login_create_account" onclick="handleSignUp()"></button></div>
    <button class="small-link" style="display:block; text-align:center; width:100%; margin-top:14px;" onclick="goBackToLogin()" data-i18n="signup_go_login"></button>
  </div>

  <div class="overlay" id="recovery-set-password" style="display:none;">
    <h2 class="display" data-i18n="login_recovery_title"></h2>
    <p class="lead" data-i18n="login_recovery_lead"></p>
    <div class="field">
      <label data-i18n="login_new_password_label"></label>
      <input type="password" id="recovery-new-pw" data-i18n-ph="login_password_ph">
      <p class="err-text" id="recovery-new-pw-err"></p>
    </div>
    <div class="field"><button class="btn btn-primary" data-i18n="login_recovery_submit" onclick="submitNewPassword()"></button></div>
  </div>

  <div class="overlay" id="onboard">
    <h2 class="display" data-i18n="ob_title"></h2>
    <p class="lead" data-i18n="ob_lead"></p>

    <div class="field"><label data-i18n="ob_name_label"></label><input type="text" id="ob-name" data-i18n-ph="ob_name_ph"></div>

    <div class="two-col">
      <div class="field"><label data-i18n="ob_weight_label"></label><input type="number" id="ob-weight" value="70" min="30" max="200"></div>
      <div class="field"><label data-i18n="ob_height_label"></label><input type="number" id="ob-height" value="170" min="120" max="230"></div>
    </div>

    <div class="field"><label data-i18n="ob_birth_label"></label><input type="date" id="ob-birth" value="1995-01-01"></div>

    <div class="field">
      <label data-i18n="ob_weeklykm_label"></label>
      <input type="number" id="ob-weeklykm" value="10" min="0" max="150">
      <p class="muted" style="margin-top:6px;" data-i18n="ob_weeklykm_hint"></p>
    </div>

    <div class="field">
      <label data-i18n="ob_terrain_label"></label>
      <div class="choice-row" id="ob-terrain">
        <div class="choice active" data-v="asfalto" data-i18n="ob_terrain_asfalto"></div>
        <div class="choice" data-v="trail" data-i18n="ob_terrain_trail"></div>
        <div class="choice" data-v="mixto" data-i18n="ob_terrain_mixto"></div>
      </div>
    </div>

    <div class="field">
      <label data-i18n="ob_days_label"></label>
      <div class="day-picker" id="ob-days">
        <div class="day-pill" data-v="mon"></div>
        <div class="day-pill active" data-v="tue"></div>
        <div class="day-pill" data-v="wed"></div>
        <div class="day-pill active" data-v="thu"></div>
        <div class="day-pill" data-v="fri"></div>
        <div class="day-pill" data-v="sat"></div>
        <div class="day-pill active" data-v="sun"></div>
      </div>
    </div>

    <div class="field">
      <label data-i18n="ob_goal_label"></label>
      <select id="ob-goal">
        <option value="start" data-i18n="ob_goal_start"></option>
        <option value="5k" data-i18n="ob_goal_5k"></option>
        <option value="10k" data-i18n="ob_goal_10k"></option>
        <option value="15k" data-i18n="ob_goal_15k"></option>
        <option value="21k" data-i18n="ob_goal_21k"></option>
        <option value="42k" data-i18n="ob_goal_42k"></option>
        <option value="ultra" data-i18n="ob_goal_ultra"></option>
        <option value="lifestyle" data-i18n="ob_goal_lifestyle"></option>
      </select>
    </div>

    <div class="field"><button class="btn btn-primary" data-i18n="ob_submit" onclick="finishOnboard()"></button></div>
  </div>

  <header class="top" id="mainHeader" style="display:none;">
    <div class="brand"><div class="dot"></div><span>ZANCADA</span></div>
    <div class="muted mono" id="headerDate" style="font-size:12px;"></div>
  </header>

  <section class="view" id="view-inicio">
    <p class="greeting"><span data-i18n="home_hi"></span> <span class="display" id="home-name">—</span> 👋</p>

    <div class="card">
      <h3 data-i18n="home_next"></h3>
      <div class="next-session">
        <div><div class="big display" id="home-next-title">—</div><p class="muted" id="home-next-desc"></p></div>
        <div style="text-align:right;"><div class="day-dist" id="home-next-dist" style="font-size:20px;"></div><div id="home-next-zone" style="margin-top:6px;"></div></div>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="home_week"></h3>
      <div class="stat-row">
        <div class="stat-box"><div class="n mono" id="home-week-km">0</div><div class="l" data-i18n="home_km_planned"></div></div>
        <div class="stat-box"><div class="n mono" id="home-week-sessions">0</div><div class="l" data-i18n="home_sessions"></div></div>
        <div class="stat-box"><div class="n mono" id="home-runs-count">0</div><div class="l" data-i18n="home_logged"></div></div>
      </div>
      <div class="week-bars" id="home-week-bars"></div>
    </div>

    <div class="card coach-snippet">
      <div class="coach-avatar">🏃</div>
      <div><p class="muted" id="home-coach-msg"></p><button class="small-link" style="margin-top:8px;" onclick="showView('coach')" data-i18n="home_coach_cta"></button></div>
    </div>
  </section>

  <section class="view" id="view-plan">
    <h2 class="display" style="font-size:25px; margin-bottom:4px;" data-i18n="plan_title"></h2>
    <p class="muted" id="plan-week-info" style="margin-bottom:4px;"></p>
    <p class="muted" style="margin-bottom:14px;" data-i18n="plan_lead"></p>
    <div class="card" id="plan-list"></div>
    <button class="btn btn-outline" data-i18n="plan_adjust" onclick="goCoachWithPrompt('')"></button>
    <div class="card" id="past-weeks-card" style="display:none; margin-top:14px;">
      <h3 data-i18n="plan_past_weeks"></h3>
      <div id="past-weeks-list"></div>
    </div>
  </section>

  <section class="view" id="view-correr">
    <h2 class="display" style="font-size:25px;" data-i18n="run_title"></h2>
    <div id="runIdle">
      <p class="muted" style="margin-top:6px;" data-i18n="run_idle_desc"></p>
      <button class="go-circle" onclick="startRun()"><span class="display" data-i18n="run_start"></span><span style="font-size:10.5px; opacity:.7;" data-i18n="run_start_hint"></span></button>
      <p class="muted" id="geo-warning" style="display:none; color:var(--danger);"></p>
    </div>

    <div id="runActive">
      <p style="text-align:center; margin-top:4px;"><span class="rec-dot"></span><span class="muted" style="text-transform:uppercase; font-size:11px; letter-spacing:.07em;" data-i18n="run_recording"></span></p>
      <div class="timer-big mono" id="track-timer">00:00:00</div>
      <div class="map-wrap"><div id="liveMap"></div><button class="map-recenter-btn" onclick="recenterMap()">◎</button></div>

      <div class="track-stats stat-row">
        <div class="stat-box"><div class="n mono" id="track-dist">0.00</div><div class="l" data-i18n="run_km"></div></div>
        <div class="stat-box"><div class="n mono" id="track-pace">—</div><div class="l" data-i18n="run_pace"></div></div>
      </div>

      <div class="run-controls">
        <button class="btn btn-outline" id="pauseBtn" onclick="togglePause()"></button>
        <button class="btn btn-danger" data-i18n="run_finish" onclick="stopRun()"></button>
      </div>
    </div>

    <div id="runSummary">
      <div class="card">
        <h3 data-i18n="run_summary_title"></h3>
        <div class="stat-row">
          <div class="stat-box"><div class="n mono" id="sum-dist">0</div><div class="l" data-i18n="run_km"></div></div>
          <div class="stat-box"><div class="n mono" id="sum-time">0</div><div class="l" data-i18n="run_time"></div></div>
          <div class="stat-box"><div class="n mono" id="sum-pace">0</div><div class="l" data-i18n="run_pace"></div></div>
          <div class="stat-box"><div class="n mono" id="sum-cal">0</div><div class="l" data-i18n="run_calories"></div></div>
        </div>
      </div>
      <div class="card"><h3 data-i18n="run_summary_shoe_q"></h3><select id="sum-shoe"></select></div>
      <button class="btn btn-primary" data-i18n="run_summary_done" onclick="closeSummary()"></button>
    </div>
  </section>

  <section class="view" id="view-history">
    <h2 class="display" style="font-size:25px; margin-bottom:12px;" data-i18n="hist_title"></h2>
    <button class="btn btn-outline btn-sm" style="width:100%; margin-bottom:14px;" data-i18n="hist_manual_add" onclick="toggleManualForm()"></button>
    <div class="card" id="manual-run-card" style="display:none;">
      <h3 data-i18n="hist_manual_title"></h3>
      <div class="field"><label data-i18n="hist_manual_date"></label><input type="date" id="man-date"></div>
      <div class="two-col">
        <div class="field"><label data-i18n="hist_manual_dist"></label><input type="number" id="man-dist" step="0.1"></div>
        <div class="field"><label data-i18n="hist_manual_dur"></label><input type="number" id="man-dur"></div>
      </div>
      <div class="field"><label data-i18n="hist_manual_hr"></label><input type="number" id="man-hr"></div>

const LANG_NAMES={es:"español",en:"English",pt:"português",fr:"français",it:"italiano",de:"Deutsch"};
const LOCALE_MAP={es:"es-AR",en:"en-US",pt:"pt-BR",fr:"fr-FR",it:"it-IT",de:"de-DE"};
let lang = 'es';
function t(key, vars){
  let s = (I18N[lang]&&I18N[lang][key]) || I18N.es[key] || key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.replace('{'+k+'}', vars[k]); });
  return s;
}
function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  document.getElementById('pauseBtn').textContent = tracker.running ? t('run_pause') : t('run_resume');
  document.getElementById('perfil-lang-select').value = lang;
}
function setLang(code){
  lang = code; state.lang = code;
  document.querySelectorAll('#lang-row-splash .lang-pill').forEach(p=>p.classList.toggle('active', p.dataset.v===code));
  applyStaticTranslations();
  populateOnboardDays();
  if(state.onboarded){ renderAll(); renderHistory(); renderZones(); renderPerfilDays(); persist(); }
}
['es','en','pt','fr','it','de'].forEach(code=>{
  const el = document.createElement('div');
  el.className='lang-pill'+(code==='es'?' active':''); el.dataset.v=code; el.textContent=code.toUpperCase();
  el.onclick=()=>setLang(code);
  document.getElementById('lang-row-splash').appendChild(el);
});

/* ================= STATE ================= */
let state = {onboarded:false, profile:{}, plan:[], runs:[], shoes:[], event:null, chat:[], lang:'es'};
let pendingEmail = '';
let currentUserId = null;
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const ZONE_COLORS = {1:'#5B9BFF',2:'#4ADE80',3:'#FACC15',4:'#FB923C',5:'#FF6B5D'};

/* ---- Supabase: cuentas y datos reales, sincronizados entre dispositivos ---- */
const SUPABASE_URL = 'https://smcicgaraqlvalxvdriz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__JlJqs3dTRRxBcR0QhkUpA_sSPPOW6j';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function persist(){
  if(!currentUserId) return;
  try{
    await supabaseClient.from('app_state').upsert({ user_id: currentUserId, data: state, updated_at: new Date().toISOString() });
  }catch(e){ console.error('persist error', e); }
}
async function loadUserAndEnter(user){
  currentUserId = user.id;
  try{
    const { data } = await supabaseClient.from('app_state').select('data').eq('user_id', user.id).maybeSingle();
    if(data && data.data && Object.keys(data.data).length){
      state = data.data; lang = state.lang || 'es';
      enterApp();
      return;
    }
  }catch(e){ console.error('load error', e); }
  // usuario autenticado pero sin datos todavía (recién registrado) -> onboarding
  pendingEmail = user.email;
  document.getElementById('splash').style.display='none';
  document.getElementById('login').style.display='none';
  document.getElementById('onboard').style.display='block';
}
function translateAuthError(error){
  const msg = (error && error.message) || '';
  if(msg.includes('Invalid login')) return t('login_err_wrong_password');
  if(msg.includes('already registered') || msg.includes('User already registered')) return t('login_err_exists');
  if(msg.includes('Password should be')) return t('login_err_password');
  return msg || t('login_err');
}

/* ================= LOGIN / ONBOARD ================= */
function goLogin(){ document.getElementById('splash').style.display='none'; document.getElementById('login').style.display='block'; }
function goSignup(){ document.getElementById('login').style.display='none'; document.getElementById('signup').style.display='block'; }
function goBackToLogin(){ document.getElementById('signup').style.display='none'; document.getElementById('login').style.display='block'; }
function showSoonNote(){ document.getElementById('soon-note').style.display='block'; }
async function handleSignIn(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-err');
  err.style.display='none';
  if(!email || !email.includes('@')){ err.textContent = t('login_err'); err.style.display='block'; return; }
  if(!password){ err.textContent = t('login_err_password'); err.style.display='block'; return; }
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){ err.textContent = translateAuthError(error); err.style.display='block'; return; }
  await loadUserAndEnter(data.user);
}
async function handleSignUp(){
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const err = document.getElementById('signup-err');
  err.style.display='none';
  if(!email || !email.includes('@')){ err.textContent = t('login_err'); err.style.display='block'; return; }
  if(!password || password.length < 6){ err.textContent = t('login_err_password'); err.style.display='block'; return; }
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if(error){ err.textContent = translateAuthError(error); err.style.display='block'; return; }
  if(!data.session){ err.textContent = t('login_check_email'); err.style.display='block'; return; }
  pendingEmail = email;
  currentUserId = data.user.id;
  document.getElementById('signup').style.display='none';
  document.getElementById('onboard').style.display='block';
}
async function handleForgotPassword(){
  const email = document.getElementById('login-email').value.trim();
  const err = document.getElementById('login-err');
  err.style.display='none';
  if(!email || !email.includes('@')){ err.textContent = t('login_err'); err.style.display='block'; return; }
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
  if(error){ err.textContent = translateAuthError(error); err.style.display='block'; return; }
  err.style.color = 'var(--hivis)';
  err.textContent = t('login_recovery_sent'); err.style.display='block';
}
supabaseClient.auth.onAuthStateChange((event, session)=>{
  if(event === 'PASSWORD_RECOVERY'){
    document.getElementById('splash').style.display='none';
    document.getElementById('login').style.display='none';
    document.getElementById('onboard').style.display='none';
    document.getElementById('recovery-set-password').style.display='block';
  }
});
async function submitNewPassword(){
  const newPw = document.getElementById('recovery-new-pw').value;
  const err = document.getElementById('recovery-new-pw-err');
  err.style.display='none';
  if(!newPw || newPw.length < 6){ err.textContent = t('login_err_password'); err.style.display='block'; return; }
  const { error } = await supabaseClient.auth.updateUser({ password: newPw });
  if(error){ err.textContent = translateAuthError(error); err.style.display='block'; return; }
  const { data: { user } } = await supabaseClient.auth.getUser();
  document.getElementById('recovery-set-password').style.display='none';
  await loadUserAndEnter(user);
}
document.getElementById('ob-terrain').addEventListener('click', e=>{
  const c=e.target.closest('.choice'); if(!c) return;
  [...document.getElementById('ob-terrain').children].forEach(x=>x.classList.remove('active')); c.classList.add('active');
});
document.getElementById('voice-toggle').addEventListener('click', e=>{
  const c=e.target.closest('.choice'); if(!c) return;
  [...document.getElementById('voice-toggle').children].forEach(x=>x.classList.remove('active')); c.classList.add('active');
  state.voiceEnabled = c.dataset.v === 'on';
  persist();
});
document.getElementById('ob-days').addEventListener('click', e=>{
  const c=e.target.closest('.day-pill'); if(!c) return;
  c.classList.toggle('active');
});
document.getElementById('perfil-days').addEventListener('click', e=>{
  const c=e.target.closest('.day-pill'); if(!c) return;
  c.classList.toggle('active');
});
function populateOnboardDays(){
  document.querySelectorAll('#ob-days .day-pill').forEach(el=>{ el.textContent = t('day_'+el.dataset.v).slice(0,3); });
}
function renderPerfilDays(){
  const selected = state.profile.trainingDays || [];
  document.getElementById('perfil-days').innerHTML = DAY_KEYS.map(d=>
    `<div class="day-pill${selected.includes(d)?' active':''}" data-v="${d}">${t('day_'+d).slice(0,3)}</div>`).join('');
}
function saveTrainingDays(){
  const selected = [...document.querySelectorAll('#perfil-days .day-pill.active')].map(el=>el.dataset.v);

function computeZones(hrmax){

}

/* ================= PLAN GENERATION (con progresión semana a semana) ================= */
function getMondayISO(d){
  const dt = new Date(d);
  const day = dt.getDay();
  dt.setDate(dt.getDate() + (day===0 ? -6 : 1-day));
  dt.setHours(0,0,0,0);
  return dt.toISOString().slice(0,10);
}
function isCutbackWeek(n){ return n % 4 === 0; }
function weekMultiplier(n){
  n = n || 1;
  const growthSteps = n - Math.floor(n/4) - 1;
  let mult = Math.pow(1.06, Math.max(0, growthSteps));
  if(isCutbackWeek(n)) mult *= 0.75;
  return Math.min(mult, 1.8);
}
function checkWeekRollover(){
  if(!state.onboarded) return;
  const currentMonday = getMondayISO(new Date());
  if(state.weekStart !== currentMonday){
    if(!state.planHistory) state.planHistory = [];
    if(state.weekStart && state.plan && state.plan.length){
      state.planHistory.push({weekNumber: state.weekNumber||1, weekStart: state.weekStart, plan: state.plan});
    }
    const prevMonday = new Date(state.weekStart || currentMonday);
    const diffWeeks = Math.max(1, Math.round((new Date(currentMonday) - prevMonday)/(7*86400000)));
    state.weekNumber = (state.weekNumber||1) + diffWeeks;
    state.weekStart = currentMonday;
    state.plan = generatePlan(state.profile, state.weekNumber);
    persist();
  }
}
function distributeSessionTypes(trainingDays, beginner){
  if(!trainingDays.length) return {};
  const pref = ['sun','sat','fri','thu','wed','tue','mon'];
  let longDay = trainingDays[trainingDays.length-1];
  for(const d of pref){ if(trainingDays.includes(d)){ longDay = d; break; } }
  const remaining = trainingDays.filter(d=>d!==longDay);
  const sessions = {}; sessions[longDay] = 'long';
  if(beginner){
    remaining.forEach(d=>{ sessions[d]='easy'; });
  } else {
    remaining.forEach((d,i)=>{ sessions[d] = i===0 ? 'intervals' : i===1 ? 'tempo' : 'easy'; });
  }
  return sessions;
}
function generatePlan(p, weekNumber){
  weekNumber = weekNumber || 1;
  const mult = weekMultiplier(weekNumber);
  const beginner = p.weeklyKm === 0;
  const per = (beginner ? 2.5 : Math.max(3, p.weeklyKm/3)) * mult;
  const easy = Math.round(per*0.9), quality = Math.round(per*1.15), tempo = Math.round(per*0.85), long = Math.round(per*(beginner?1.3:1.5));
  const distMap = {easy, intervals:quality, tempo, long};
  const zoneMap = {easy:beginner?1:2, intervals:4, tempo:3, long:2};
  const defaultDays = beginner ? ['tue','thu','sun'] : ['tue','wed','fri','sun'];
  const trainingDays = DAY_KEYS.filter(d => (p.trainingDays && p.trainingDays.length ? p.trainingDays : defaultDays).includes(d));
  const sessionMap = distributeSessionTypes(trainingDays, beginner);
  return DAY_KEYS.map(day=>{
    const typeKey = sessionMap[day];
    if(!typeKey) return {day, typeKey:'rest', dist:0, terrain:null, zone:null, beginner};
    return {day, typeKey, dist:distMap[typeKey], terrain: typeKey==='intervals' ? 'asfalto' : p.terrain, zone:zoneMap[typeKey], beginner};
  });
}
function planLabel(d){
  if(d.custom) return {type:d.type, desc:d.desc};
  const suf = d.beginner && (d.typeKey==='easy'||d.typeKey==='long') ? '_beginner' : '';
  return {type:t('type_'+d.typeKey), desc:t('desc_'+d.typeKey+suf)};
}

  try{ const u = new SpeechSynthesisUtterance(text); u.lang = LOCALE_MAP[lang]; window.speechSynthesis.speak(u); }catch(e){}

function maybeAnnounceKm(){
  const currentKm = Math.floor(tracker.distanceKm);
  if(currentKm>0 && currentKm>tracker.lastAnnouncedKm){
    tracker.lastAnnouncedKm = currentKm;
    const paceMin = (tracker.elapsedSec/60)/tracker.distanceKm;
    const paceStr = `${Math.floor(paceMin)}:${String(Math.round((paceMin%1)*60)).padStart(2,'0')}`;
    speak(t('voice_km',{km:currentKm, pace:paceStr}));
  }
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtTime(sec){
  const h=String(Math.floor(sec/3600)).padStart(2,'0'), m=String(Math.floor((sec%3600)/60)).padStart(2,'0'), s=String(Math.floor(sec%60)).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function classifyHR(bpm){
  const z = state.profile.hrZones; if(!z) return 2;
  if(bpm<=z[1].max) return 1; if(bpm<=z[2].max) return 2; if(bpm<=z[3].max) return 3; if(bpm<=z[4].max) return 4; return 5;
}
function initLiveMap(){
  if(liveMap){ liveMap.remove(); liveMap=null; }
  liveMap = L.map('liveMap', {zoomControl:false, attributionControl:false}).setView([0,0], 15);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:20, subdomains:'abcd'}).addTo(liveMap);
  livePolyline = L.polyline([], {color:'#D6FF3F', weight:5, lineCap:'round', lineJoin:'round'}).addTo(liveMap);
  liveMarker = null; startMarker = null;
  setTimeout(()=>{ if(liveMap) liveMap.invalidateSize(); }, 250);
}
function updateLiveMap(lat, lon){
  if(!liveMap) return;
  livePolyline.addLatLng([lat,lon]);
  if(!startMarker){
    startMarker = L.circleMarker([lat,lon], {radius:6, color:'#fff', weight:2, fillColor:'#4ADE80', fillOpacity:1}).addTo(liveMap);
  }
  if(liveMarker) liveMap.removeLayer(liveMarker);
  liveMarker = L.circleMarker([lat,lon], {radius:8, color:'#121415', weight:3, fillColor:'#D6FF3F', fillOpacity:1}).addTo(liveMap);
  liveMap.setView([lat,lon], Math.max(liveMap.getZoom(),16));
}
function recenterMap(){
  if(liveMap && liveMarker) liveMap.setView(liveMarker.getLatLng(), 17);
}
function startRun(){
  if(!navigator.geolocation){ document.getElementById('geo-warning').style.display='block'; document.getElementById('geo-warning').textContent=t('geo_err_support'); return; }
  tracker = {watchId:null, timerId:null, points:[], distanceKm:0, elapsedSec:0, running:true, hrLog:[], lastAnnouncedKm:0};
  requestWakeLock();
  document.getElementById('runIdle').style.display='none';
  document.getElementById('runSummary').style.display='none';
  document.getElementById('runActive').style.display='block';
  initLiveMap();
  updateLiveStats();
  tracker.watchId = navigator.geolocation.watchPosition(onPosition, onPosError, {enableHighAccuracy:true, maximumAge:1000, timeout:15000});
  tracker.timerId = setInterval(()=>{ if(tracker.running){ tracker.elapsedSec++; updateLiveStats(); } }, 1000);
}
function onPosition(pos){
  const {latitude:lat, longitude:lon, accuracy} = pos.coords;
  if(accuracy && accuracy>50) return;
  const last = tracker.points[tracker.points.length-1];
  if(last){ const d=haversine(last.lat,last.lon,lat,lon); if(d>0.002) tracker.distanceKm+=d; }
  tracker.points.push({lat,lon});
  updateLiveMap(lat,lon);
  updateLiveStats();
  maybeAnnounceKm();
}
function onPosError(){ document.getElementById('geo-warning').style.display='block'; document.getElementById('geo-warning').textContent=t('geo_err_permission'); }
function updateLiveStats(){
  document.getElementById('track-timer').textContent = fmtTime(tracker.elapsedSec);
  document.getElementById('track-dist').textContent = tracker.distanceKm.toFixed(2);
  const paceMin = tracker.distanceKm>0.02 ? (tracker.elapsedSec/60)/tracker.distanceKm : 0;
  document.getElementById('track-pace').textContent = paceMin>0 ? `${Math.floor(paceMin)}:${String(Math.round((paceMin%1)*60)).padStart(2,'0')}` : '—';
}
function togglePause(){ tracker.running = !tracker.running; document.getElementById('pauseBtn').textContent = tracker.running? t('run_pause') : t('run_resume'); }
function stopRun(){
  clearInterval(tracker.timerId);
  if(tracker.watchId!==null) navigator.geolocation.clearWatch(tracker.watchId);
  releaseWakeLock();
  document.getElementById('runActive').style.display='none';
  document.getElementById('runSummary').style.display='block';
  const paceMin = tracker.distanceKm>0.02 ? (tracker.elapsedSec/60)/tracker.distanceKm : 0;
  document.getElementById('sum-dist').textContent = tracker.distanceKm.toFixed(2);
  document.getElementById('sum-time').textContent = fmtTime(tracker.elapsedSec);
  document.getElementById('sum-pace').textContent = paceMin>0 ? `${Math.floor(paceMin)}:${String(Math.round((paceMin%1)*60)).padStart(2,'0')}` : '—';
  document.getElementById('sum-cal').textContent = Math.round((state.profile.weight||70)*tracker.distanceKm*1.036);
  const sel = document.getElementById('sum-shoe');
  sel.innerHTML = state.shoes.length ? state.shoes.map(s=>`<option value="${s.id}">${s.name}</option>`).join('') : `<option value="">${t('no_shoes')}</option>`;
}
function closeSummary(){
  const shoeId = parseInt(document.getElementById('sum-shoe').value);
  const shoe = state.shoes.find(s=>s.id===shoeId);
  if(shoe) shoe.km += tracker.distanceKm;
  const runDate = new Date().toISOString();
  const runId = Date.now();
  state.runs.push({id:runId, date:runDate, distanceKm:tracker.distanceKm, durationSec:tracker.elapsedSec, hrLog:tracker.hrLog, points:tracker.points, shoeId:shoeId||null});
  autoMarkSessionDone(runDate, runId);
  document.getElementById('runSummary').style.display='none';
  document.getElementById('runIdle').style.display='block';
  renderAll(); renderHistory(); persist();
  showView('inicio');
}
function autoMarkSessionDone(dateIso, runId){
  const monday = getMondayISO(new Date(dateIso));
  if(monday !== state.weekStart) return;
  const idx = (new Date(dateIso).getDay()+6)%7;
  if(state.plan[idx] && !state.plan[idx].status){ state.plan[idx].status = 'done'; state.plan[idx].linkedRunId = runId; }
}
function toggleManualForm(){
  const el = document.getElementById('manual-run-card');
  const show = el.style.display==='none';
  el.style.display = show?'block':'none';
  if(show){
    document.getElementById('man-date').value = new Date().toISOString().slice(0,10);
    const sel = document.getElementById('man-shoe');
    sel.innerHTML = state.shoes.length ? state.shoes.map(s=>`<option value="${s.id}">${s.name}</option>`).join('') : `<option value="">${t('no_shoes')}</option>`;
  }
}
function saveManualRun(){
  const date = document.getElementById('man-date').value;
  const dist = parseFloat(document.getElementById('man-dist').value);
  const durMin = parseFloat(document.getElementById('man-dur').value);
  if(!date || !dist || !durMin) return;
  const hr = parseInt(document.getElementById('man-hr').value);
  const shoeId = parseInt(document.getElementById('man-shoe').value) || null;
  const isoDate = new Date(date+'T12:00:00').toISOString();
  const runId = Date.now();
  state.runs.push({id:runId, date:isoDate, distanceKm:dist, durationSec:Math.round(durMin*60), hrLog: hr?[{t:0,bpm:hr}]:[], points:[], shoeId, manual:true});
  const shoe = state.shoes.find(s=>s.id===shoeId);
  if(shoe) shoe.km += dist;
  autoMarkSessionDone(isoDate, runId);
  document.getElementById('man-dist').value=''; document.getElementById('man-dur').value=''; document.getElementById('man-hr').value='';
  toggleManualForm();
  renderAll(); renderHistory(); persist();
}

/* ================= HISTORY ================= */
function miniRouteSvg(points){
  if(!points || points.length<2) return `<div class="hist-route" style="display:flex;align-items:center;justify-content:center; color:var(--mist-dim); font-size:12px;">—</div>`;
  const lats=points.map(p=>p.lat), lons=points.map(p=>p.lon);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLon=Math.min(...lons), maxLon=Math.max(...lons);
  const w=300,h=104,pad=14, sx=(maxLon-minLon)||0.0002, sy=(maxLat-minLat)||0.0002;
  const pts = points.map(p=>`${(pad+((p.lon-minLon)/sx)*(w-2*pad)).toFixed(1)},${(h-pad-((p.lat-minLat)/sy)*(h-2*pad)).toFixed(1)}`).join(' ');
  return `<svg class="hist-route" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#D6FF3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function computeTrends(){
  const weeks = [];
  const today = new Date();
  for(let i=7;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-7*i); weeks.push(getMondayISO(d)); }
  const kmByWeek = weeks.map(wk => state.runs.filter(r=>getMondayISO(new Date(r.date))===wk).reduce((a,r)=>a+r.distanceKm,0));
  const totalKm = state.runs.reduce((a,r)=>a+r.distanceKm,0);
  const withDist = state.runs.filter(r=>r.distanceKm>0.1);
  const avgPace = withDist.length ? withDist.reduce((a,r)=>a+r.durationSec/60,0) / withDist.reduce((a,r)=>a+r.distanceKm,0) : null;
  return {weeks, kmByWeek, totalKm, totalRuns: state.runs.length, avgPace};
}
function renderHistory(){
  const el = document.getElementById('history-list');
  const tr = computeTrends();
  const maxKm = Math.max(...tr.kmByWeek, 1);
  const paceStr = tr.avgPace ? `${Math.floor(tr.avgPace)}:${String(Math.round((tr.avgPace%1)*60)).padStart(2,'0')}` : '—';
  const trendsCard = `<div class="card">
    <h3 data-i18n="hist_trends">${t('hist_trends')}</h3>
    <div class="stat-row">
      <div class="stat-box"><div class="n mono">${tr.totalKm.toFixed(0)}</div><div class="l">${t('hist_total_km')}</div></div>
      <div class="stat-box"><div class="n mono">${tr.totalRuns}</div><div class="l">${t('hist_total_runs')}</div></div>
      <div class="stat-box"><div class="n mono">${paceStr}</div><div class="l">${t('run_pace')}</div></div>
    </div>
    <div class="week-bars" style="margin-top:14px;">${tr.kmByWeek.map((km,i)=>{
      const h = Math.max(4, Math.round((km/maxKm)*70));
      const dt = new Date(tr.weeks[i]);
      return `<div class="bar-col"><div class="bar ${km>0?'hivis':'rest-day'}" style="height:${h}px;"></div><div class="lbl">${dt.getDate()}/${dt.getMonth()+1}</div></div>`;
    }).join('')}</div>
  </div>`;
  if(!state.runs || state.runs.length===0){ el.innerHTML = trendsCard + `<p class="muted">${t('hist_empty')}</p>`; return; }
  el.innerHTML = trendsCard + state.runs.slice().reverse().map(r=>{
    const shoe = state.shoes.find(s=>s.id===r.shoeId);
    const paceMin = r.distanceKm>0.02 ? (r.durationSec/60)/r.distanceKm : 0;
    const rPaceStr = paceMin>0 ? `${Math.floor(paceMin)}:${String(Math.round((paceMin%1)*60)).padStart(2,'0')}` : '—';
    const avgHr = r.hrLog && r.hrLog.length ? Math.round(r.hrLog.reduce((a,h)=>a+h.bpm,0)/r.hrLog.length) : null;
    const cal = Math.round((state.profile.weight||70)*r.distanceKm*1.036);
    const dateStr = new Date(r.date).toLocaleDateString(LOCALE_MAP[lang], {weekday:'short', day:'numeric', month:'short'});
    return `<div class="card hist-card">
      <div class="hist-top"><span style="font-weight:700;">${dateStr}</span><span class="hist-date">${r.manual? `<span class="tag tag-soon" style="margin-right:6px;">${t('hist_manual_tag')}</span>`:''}${fmtTime(r.durationSec)}</span></div>
      ${miniRouteSvg(r.points)}
      <div class="stat-row">
        <div class="stat-box"><div class="n mono">${r.distanceKm.toFixed(2)}</div><div class="l">${t('run_km')}</div></div>
        <div class="stat-box"><div class="n mono">${rPaceStr}</div><div class="l">${t('run_pace')}</div></div>
        <div class="stat-box"><div class="n mono">${avgHr||'—'}</div><div class="l">${t('hist_avg_hr')}</div></div>
        <div class="stat-box"><div class="n mono">${cal}</div><div class="l">${t('run_calories')}</div></div>
      </div>
      <p class="muted" style="margin-top:8px;">${t('hist_shoe')}: ${shoe? shoe.name : t('hist_no_shoe')}</p>
      ${r.hrLog && r.hrLog.length ? `<div class="hist-hrlist">${r.hrLog.map(h=>`<span class="zone-chip zone-${classifyHR(h.bpm)}">${h.bpm} bpm</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

/* ================= COACH CHAT (con tool-use real para editar el plan) ================= */
function seedCoachGreeting(){
  state.chat = [{role:'coach', text: t('coach_greeting', {name:state.profile.name, km:state.profile.weeklyKm, goal:t('ob_goal_'+state.profile.goal)})}];
  renderChat();
}
function renderChat(){
  document.getElementById('chatLog').innerHTML = state.chat.map(m=>`<div class="msg ${m.role}">${m.text}</div>`).join('');
  document.getElementById('chatLog').scrollTop = document.getElementById('chatLog').scrollHeight;
}
function buildContext(){
  const p = state.profile;
  let ctx = `Nombre: ${p.name}. Edad aprox: ${ageFromBirth(p.birth)}. Corre ${p.weeklyKm}km/semana. Terreno: ${p.terrain}. Objetivo: ${t('ob_goal_'+p.goal)}. Zonas de FC (bpm): ${JSON.stringify(p.hrZones)}.`;
  if(state.event) ctx += ` Evento objetivo: ${state.event.name} (${state.event.type}) el ${state.event.date}.`;
  if(state.runs.length){ const last = state.runs[state.runs.length-1]; ctx += ` Última carrera: ${last.distanceKm.toFixed(2)}km en ${fmtTime(last.durationSec)}.`; }
  if(state.shoes.length) ctx += ` Zapatillas: ${state.shoes.map(s=>`${s.name} (${s.km.toFixed(0)}km, ${s.terrain})`).join(', ')}.`;
  ctx += ` Plan actual: ${state.plan.map(d=>`${d.day}=${d.custom?d.type:d.typeKey}${d.zone?'/Z'+d.zone:''}/${d.dist}km`).join(', ')}.`;
  return ctx;
}
const TOOLS = [
  {
    name:"modificar_sesion",
    description:"Modifica UNA sesión puntual del plan semanal: tipo, distancia, zona de frecuencia cardíaca objetivo, terreno y descripción. Usala cuando el corredor pida un cambio en un día específico.",
    input_schema:{type:"object", properties:{
      dia:{type:"string", enum:DAY_KEYS, description:"Código del día: mon,tue,wed,thu,fri,sat,sun (siempre en estos códigos, sin importar el idioma de la charla)"},
      tipo:{type:"string", description:"Nombre del tipo de sesión en el idioma de la conversación, ej. 'Rodaje suave', 'Easy run'"},
      distancia_km:{type:"number"},
      zona:{type:"integer", minimum:1, maximum:5},
      terreno:{type:"string", enum:["asfalto","trail","mixto"]},
      descripcion:{type:"string", description:"Instrucción breve para el corredor, en el idioma de la conversación"}
    }, required:["dia","tipo","descripcion"]}
  },
  {
    name:"ajustar_volumen_semana",
    description:"Sube o baja el volumen (distancia) de TODAS las sesiones de running de la semana ACTUAL, aplicando un mismo porcentaje. Usala para pedidos generales como 'quiero correr más', 'esta semana quiero sumar kilómetros' o 'bajale un poco', sin que el corredor especifique un día puntual.",
    input_schema:{type:"object", properties:{
      porcentaje:{type:"number", description:"Cambio porcentual a aplicar a la distancia de cada sesión de esta semana. Ejemplo: 15 para +15%, -10 para -10%."}
    }, required:["porcentaje"]}
  },
  {
    name:"modificar_perfil",
    description:"Modifica datos personales del corredor que afectan cómo se generan sus PRÓXIMOS planes semanales: kilómetros semanales base, objetivo de entrenamiento, terreno preferido o frecuencia cardíaca máxima. Usala para cambios permanentes o 'de ahora en adelante', no solo para esta semana.",
    input_schema:{type:"object", properties:{
      km_semanales_base:{type:"number", description:"Nuevo kilometraje semanal base a partir del cual se calculan los próximos planes."},
      objetivo:{type:"string", enum:["start","5k","10k","15k","21k","42k","ultra","lifestyle"]},
      terreno:{type:"string", enum:["asfalto","trail","mixto"]},
      fc_maxima:{type:"number"}
    }}
  }
];
function applyPlanChange(input){
  const d = state.plan.find(x=>x.day===input.dia);
  if(!d) return "Día no encontrado.";
  d.custom = true;
  d.type = input.tipo; d.desc = input.descripcion;
  if(typeof input.distancia_km==='number') d.dist = input.distancia_km;
  if(input.zona) d.zone = input.zona;
  if(input.terreno) d.terrain = input.terreno;
  renderPlan(); renderHome(); persist();
  state.chat.push({role:'system', text:t('coach_plan_updated')+': '+t('day_'+d.day)});
  return `OK, actualizado ${d.day}: ${d.type}, ${d.dist}km${d.zone?', zona '+d.zone:''}.`;
}
function applyVolumeAdjust(input){
  const pct = input.porcentaje;
  if(typeof pct !== 'number') return 'Falta el porcentaje.';
  const factor = 1 + (pct/100);
  state.plan.forEach(d=>{ if(d.dist>0){ d.dist = Math.max(1, Math.round(d.dist*factor)); d.custom = true; } });
  renderPlan(); renderHome(); persist();
  state.chat.push({role:'system', text:t('coach_plan_updated')});
  return `OK, ajusté el volumen de esta semana ${pct>0?'+':''}${pct}%.`;
}
function applyProfileChange(input){
  const changes = [];
  if(typeof input.km_semanales_base==='number'){ state.profile.weeklyKm = input.km_semanales_base; changes.push('km semanales base'); }
  if(input.objetivo){ state.profile.goal = input.objetivo; changes.push('objetivo'); }
  if(input.terreno){ state.profile.terrain = input.terreno; changes.push('terreno'); }
  if(typeof input.fc_maxima==='number'){ state.profile.hrMax = input.fc_maxima; state.profile.hrKnown = true; state.profile.hrZones = computeZones(input.fc_maxima); changes.push('FC máxima'); }
  if(!changes.length) return 'No hubo cambios para aplicar.';
  renderAll(); renderZones(); persist();
  state.chat.push({role:'system', text:t('coach_plan_updated')});
  return `Perfil actualizado: ${changes.join(', ')}.`;
}
async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim(); if(!text) return;
  input.value='';
  state.chat.push({role:'user', text});
  renderChat();
  document.getElementById('chatLog').insertAdjacentHTML('beforeend', `<div class="msg coach typing" id="typing"><span></span><span></span><span></span></div>`);
  document.getElementById('chatLog').scrollTop = document.getElementById('chatLog').scrollHeight;

  let messages = state.chat.filter(m=>m.role==='user'||m.role==='coach').slice(0,-1).map(m=>({role: m.role==='user'?'user':'assistant', content:m.text}));
  messages.push({role:'user', content:text});

  const system = `Sos "Coach Zancada", el entrenador virtual dentro de la app Zancada. Hablás con calidez y honestidad, como un entrenador real de running (no un chatbot genérico). Respondé siempre en ${LANG_NAMES[lang]}. Datos del corredor: ${buildContext()}. Ayudás a definir ejercicios, responder dudas de entrenamiento en calle y trail, y personalizar el plan según los gustos del corredor.

Tenés tres herramientas para aplicar cambios reales en la app. Cuando el corredor pida un cambio, usá SIEMPRE la herramienta correspondiente en la misma respuesta — nunca digas que ya lo cambiaste sin haber llamado a la herramienta:
- modificar_sesion: para cambiar UN día puntual (tipo, distancia, zona, terreno).
- ajustar_volumen_semana: para pedidos generales de correr más o menos ESTA semana (ej. "quiero correr más km", "bajale un poco"), sin que especifiquen un día.
- modificar_perfil: para cambios permanentes de datos personales que afectan los PRÓXIMOS planes (km semanales base, objetivo, terreno, FC máxima).
Si el pedido es ambiguo entre "esta semana" y "de ahora en adelante", aplicá el cambio a esta semana con ajustar_volumen_semana para que se note ya, y preguntá si también querés que sea la nueva base con modificar_perfil.

Sé breve (4-6 líneas salvo que pidan más detalle). Si mencionan dolor persistente o algo que suene a lesión, recomendá frenar y consultar a un profesional de la salud antes de seguir entrenando.`;

  let finalText = '';
  try{
    for(let loop=0; loop<4; loop++){
      const res = await fetch('/api/chat', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({system, tools:TOOLS, messages})
      });
      const data = await res.json();
      if(data.error){ finalText = 'Coach: '+(data.error.message||'error de conexión'); break; }
      const blocks = data.content || [];
      const textPart = blocks.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
      if(textPart) finalText += (finalText? '\n':'') + textPart;
      const toolUses = blocks.filter(b=>b.type==='tool_use');
      if(toolUses.length===0) break;
      const toolResults = toolUses.map(tu=>{
        let result;
        if(tu.name==='modificar_sesion') result = applyPlanChange(tu.input);
        else if(tu.name==='ajustar_volumen_semana') result = applyVolumeAdjust(tu.input);
        else if(tu.name==='modificar_perfil') result = applyProfileChange(tu.input);
        else result = 'Herramienta no reconocida.';
        return {type:'tool_result', tool_use_id:tu.id, content: result};
      });
      messages.push({role:'assistant', content: blocks});
      messages.push({role:'user', content: toolResults});
    }
  }catch(e){ finalText = finalText || 'No me pude conectar ahora mismo. Probá de nuevo en un momento.'; }

  document.getElementById('typing')?.remove();
  state.chat.push({role:'coach', text: finalText || '...'});
  renderChat();
  persist();
}

/* Traducir todo lo estático apenas carga la página, sin esperar a que el usuario toque un idioma */
applyStaticTranslations();
populateOnboardDays();
