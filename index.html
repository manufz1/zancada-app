<script>
/* Aplica el tema guardado ANTES de que se pinte cualquier cosa, para que no haya
   un parpadeo del tema equivocado al abrir la app (por ejemplo, ver un instante el
   tema oscuro y que enseguida cambie a claro). El estado real de la preferencia
   vive en el perfil del usuario en Supabase junto con idioma/unidades -- esto es
   nada más que una copia local para pintar bien desde el primer instante, antes de
   que la sesión termine de cargar; applyTheme() en app.js la mantiene al día. */
try{
  if(localStorage.getItem('zancada_theme') === 'light') document.documentElement.setAttribute('data-theme','light');
}catch(e){}
</script>

<style>
  /* ---- Tema oscuro (default) y tema claro ----
     Todo el resto de la hoja de estilos usa estas variables, así que cambiar de tema
     es (con pocas excepciones ya resueltas abajo, como el fondo de la tabbar o el
     color de error del toast) nada más que redefinir estos valores. El atributo
     data-theme="light" en <html> es lo que activa el segundo bloque -- lo pone
     applyTheme() en app.js, y hay un script chiquito al principio del <head> que lo
     aplica de una copia guardada en localStorage ANTES de que se pinte nada, para
     que no haya un parpadeo del tema equivocado al abrir la app.

     --ink y --hivis-text existen porque el verde lima (--hivis) cumple dos roles
     distintos: como RELLENO sólido (fondo de botones, barra "hoy", el punto del
     avatar) se mantiene bien vistoso en los dos temas; pero como TEXTO -- ya sea
     encima de ese mismo relleno (--ink) o encima de un fondo con apenas un toque de
     color (--hivis-text, para chips y pills) -- necesita ser oscuro en el tema claro
     para que se siga leyendo bien sobre fondos claros. En el tema oscuro ambos son
     iguales a como estaba antes, así que el look oscuro no cambia nada. */
  :root{
    --asphalt:#121415; --asphalt-2:#1B1E20; --asphalt-3:#242829; --asphalt-4:#2E3335;
    --chalk:#EDEFEF; --mist:#8B9296; --mist-dim:#5C6366;
    --hivis:#D6FF3F; --hivis-dim:rgba(214,255,63,.14); --hivis-text:#D6FF3F; --ink:#121415;
    --clay:#C06A2E; --clay-dim:rgba(192,106,46,.16);
    --danger:#FF6B5D; --danger-dim:rgba(255,107,93,.15);
    --radius:26px; --radius-sm:18px;
    --press:rgba(255,255,255,.045); --overlay-hairline:rgba(255,255,255,.05);
    --tabbar-bg:rgba(27,30,32,.92);
    --toast-error-bg:#3a1f1c; --toast-error-fg:#FF9A8D;
    --shadow-card:0 4px 14px rgba(0,0,0,.22); --shadow-lg:0 16px 48px rgba(0,0,0,.5);
    --hivis-glow:rgba(214,255,63,.32);
    --zone1:#5B9BFF; --zone1-bg:rgba(91,155,255,.16); --zone1-bg-live:rgba(91,155,255,.13);
    --zone2:#4ADE80; --zone2-bg:rgba(74,222,128,.16); --zone2-bg-live:rgba(74,222,128,.13);
    --zone3:#FACC15; --zone3-bg:rgba(250,204,21,.16); --zone3-bg-live:rgba(250,204,21,.13);
    --zone4:#FB923C; --zone4-bg:rgba(251,146,60,.16); --zone4-bg-live:rgba(251,146,60,.13);
    --zone5:#FF6B5D; --zone5-bg:rgba(255,107,93,.16); --zone5-bg-live:rgba(255,107,93,.13);
    --cs:dark;
    --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
  }
  :root[data-theme="light"]{
    /* Estos valores fueron ajustados (más oscuros/saturados que la primera versión)
       para cumplir el contraste mínimo WCAG AA en modo claro -- la versión anterior
       de --mist, --mist-dim, --asphalt-4 y los --zoneN se veían "lavados" y costaba
       leer texto secundario, badges de zona y bordes de botones sobre fondos claros. */
    --asphalt:#F7F6F2; --asphalt-2:#FFFFFF; --asphalt-3:#F0EEE6; --asphalt-4:#B7AF91;
    --chalk:#20231F; --mist:#63675C; --mist-dim:#747362;
    --hivis:#8FA820; --hivis-dim:#EEF3D2; --hivis-text:#5C6B14; --ink:#1B1E20;
    --clay:#B0631F; --clay-dim:rgba(176,99,31,.14);
    --danger:#D6402F; --danger-dim:rgba(214,64,47,.12);
    --press:rgba(0,0,0,.035); --overlay-hairline:rgba(0,0,0,.14);
    --tabbar-bg:rgba(255,255,255,.86);
    --toast-error-bg:#FBE3DE; --toast-error-fg:#B23A28;
    --shadow-card:0 10px 26px rgba(60,58,40,.10); --shadow-lg:0 20px 50px rgba(60,58,40,.18);
    --hivis-glow:rgba(143,168,32,.28);
    --zone1:#2062CF; --zone1-bg:rgba(44,111,222,.14); --zone1-bg-live:rgba(44,111,222,.11);
    --zone2:#23773E; --zone2-bg:rgba(47,158,82,.14); --zone2-bg-live:rgba(47,158,82,.11);
    --zone3:#866108; --zone3-bg:rgba(168,121,10,.16); --zone3-bg-live:rgba(168,121,10,.12);
    --zone4:#A44C13; --zone4-bg:rgba(193,90,22,.15); --zone4-bg-live:rgba(193,90,22,.12);
    --zone5:#BA3022; --zone5-bg:rgba(196,51,36,.14); --zone5-bg-live:rgba(196,51,36,.11);
    --cs:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--asphalt); height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif; color:var(--chalk); overscroll-behavior-y:none;}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3,p{margin:0;}
  button,input,select{font-family:inherit;}
  ::selection{background:var(--hivis); color:var(--ink);}

  #app{max-width:480px; margin:0 auto; min-height:100dvh; position:relative;
    background:radial-gradient(60% 40% at 50% 0%, rgba(214,255,63,.07), transparent 60%),
      radial-gradient(55% 35% at 100% 12%, rgba(192,106,46,.05), transparent 62%), var(--asphalt);
    display:flex; flex-direction:column;}

  .pulse-strip{width:100%; height:34px; overflow:hidden; opacity:.55;}
  .pulse-strip svg{width:200%; height:100%; animation:pulseScroll 5.5s linear infinite;}
  @keyframes pulseScroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.25;}}
  @media (prefers-reduced-motion:reduce){ .pulse-strip svg{animation:none;} }

  #offline-banner{position:fixed; top:0; left:0; right:0; z-index:90; display:flex; align-items:center; justify-content:center; gap:7px;
    background:var(--clay); color:var(--ink); font-size:12px; font-weight:700; padding:calc(8px + var(--safe-top)) 16px 8px;
    transform:translateY(-100%); transition:transform .25s ease; pointer-events:none;}
  #offline-banner.show{transform:translateY(0); pointer-events:auto;}

  #splash{position:fixed; inset:0; z-index:60; background:var(--asphalt); display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; text-align:center; padding:32px; max-width:480px; margin:0 auto;}
  #splash .splash-mid{flex:1; width:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:0; padding-bottom:96px;}
  #splash .word{font-size:60px; line-height:.9;}
  #splash .word span{color:var(--hivis-text);}
  #splash .tag{color:var(--mist); margin-top:10px; font-size:15px;}
  #splash .pulse-strip{margin:28px 0; max-width:280px;}
  .splash-features{width:100%; max-width:320px; margin-top:8px; display:flex; flex-direction:column; gap:16px; text-align:left;}
  .splash-feature{display:flex; align-items:flex-start; gap:12px;}
  .splash-feature strong{display:block; font-size:14px; color:var(--chalk); font-weight:700;}
  .splash-feature p{margin:2px 0 0; font-size:12.5px; color:var(--mist); line-height:1.4;}
  .lang-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:28px;}
  .lang-pill{padding:8px 13px; border-radius:999px; border:1.5px solid var(--asphalt-4); background:var(--asphalt-2);
    color:var(--mist); font-size:12px; font-weight:700; cursor:pointer;}
  .lang-pill.active{border-color:var(--hivis); color:var(--hivis-text); background:var(--hivis-dim); box-shadow:0 4px 14px var(--hivis-glow);}

  .overlay{position:fixed; inset:0; z-index:50; background:var(--asphalt); max-width:480px; margin:0 auto;
    overflow-y:auto; display:none; padding:calc(28px + var(--safe-top)) 24px calc(28px + var(--safe-bottom));}
  .overlay h2{font-size:28px;}
  .overlay .lead{color:var(--mist); margin-top:6px; font-size:14px; line-height:1.5;}

  .confirm-email-icon{width:76px; height:76px; border-radius:50%; background:var(--hivis-dim); color:var(--hivis-text);
    display:flex; align-items:center; justify-content:center; margin:4px auto 22px;}
  .confirm-email-icon svg{width:32px; height:32px;}
  #confirm-email h2,#confirm-email .lead{text-align:center;}
  #confirm-email .lead strong{color:var(--hivis-text); font-weight:700;}
  .confirm-email-waiting{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:24px; color:var(--mist); font-size:13.5px;}

  .ob-progress-wrap{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .ob-progress{flex:1; height:5px; background:var(--asphalt-3); border-radius:999px; overflow:hidden;}
  .ob-progress-fill{height:100%; width:20%; background:var(--hivis); border-radius:999px; transition:width .3s ease;}
  .ob-step{display:none;}
  .ob-step.active{display:block; animation:viewFadeIn .22s ease;}

  .toast-wrap{position:fixed; left:0; right:0; bottom:calc(92px + var(--safe-bottom)); display:flex; justify-content:center; z-index:85; pointer-events:none; padding:0 24px; transition:bottom .15s ease;}
  body.chat-kb-open .toast-wrap{bottom:calc(85px + (var(--safe-bottom) * 2));}
  .toast{background:var(--asphalt-4); color:var(--chalk); padding:13px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.4); display:flex; align-items:center; gap:8px; max-width:360px; text-align:center;
    opacity:0; transform:translateY(10px) scale(.96); transition:opacity .22s ease, transform .22s ease; pointer-events:auto;}
  .toast.show{opacity:1; transform:translateY(0) scale(1);}
  .toast.error{background:var(--toast-error-bg); color:var(--toast-error-fg); border:1px solid rgba(255,107,93,.3);}
  .toast.success{background:var(--hivis-dim); color:var(--hivis-text); border:1px solid rgba(214,255,63,.3);}

  .confirm-backdrop{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:24px;}
  .confirm-backdrop.show{display:flex;}
  .confirm-card{background:var(--asphalt-2); border-radius:var(--radius); padding:22px; max-width:320px; width:100%;
    box-shadow:var(--shadow-lg); border:1px solid var(--overlay-hairline); animation:confirmPop .18s ease;}
  .confirm-card p{margin:0 0 20px; font-size:14.5px; line-height:1.5; color:var(--chalk); font-weight:600;}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions .btn{flex:1; width:auto;}
  @keyframes confirmPop{from{opacity:0; transform:scale(.9) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .field{margin-top:20px;}
  .field label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--mist);
    margin-bottom:8px; font-weight:600;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=email],.field input[type=password],.field select{
    width:100%; max-width:100%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--chalk);
    padding:13px 15px; border-radius:var(--radius-sm); font-size:16px; outline:none; color-scheme:var(--cs);
    transition:border-color .15s ease, box-shadow .15s ease;}
  .field input[type=date]{padding-top:9px; padding-bottom:9px; padding-right:6px; height:48px; box-sizing:border-box; overflow:hidden; font-size:15px;}
  .date-box{width:100%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--chalk);
    padding:13px 15px; border-radius:var(--radius-sm); font-size:16px; cursor:pointer;
    display:flex; align-items:center; height:48px; box-sizing:border-box;}
  .date-box .date-box-text{color:var(--chalk);}
  .date-box .date-box-text.placeholder{color:var(--mist-dim);}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--mist-dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:.04em;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:15px; cursor:pointer; color:var(--chalk);}
  .cal-day.other-month{color:var(--mist-dim); opacity:.35; pointer-events:none;}
  .cal-day.today{border:1.5px solid var(--mist-dim);}
  .cal-day.selected{background:var(--hivis); color:var(--ink); font-weight:800;}
  .cal-months-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .cal-years-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .cal-cell{padding:16px 4px; border-radius:14px; text-align:center; font-size:14.5px; cursor:pointer; color:var(--chalk); text-transform:capitalize;}
  .cal-cell.current{border:1.5px solid var(--mist-dim);}
  .cal-cell.selected{background:var(--hivis); color:var(--ink); font-weight:800;}
  #cal-month-label{background:none; border:none; cursor:pointer; padding:6px 10px;}
  .field input:focus,.field select:focus{border-color:var(--hivis); box-shadow:0 0 0 3px var(--hivis-dim);}
  .date-box{transition:border-color .15s ease, box-shadow .15s ease;}
  .date-box:focus-within,.date-box.focused{border-color:var(--hivis); box-shadow:0 0 0 3px var(--hivis-dim);}
  .choice-row{display:flex; gap:8px; flex-wrap:wrap;}
  .choice{flex:1; min-width:80px; text-align:center; padding:11px 6px; border-radius:var(--radius-sm);
    border:1.5px solid var(--asphalt-4); background:var(--asphalt-2); color:var(--mist);
    font-size:12.5px; font-weight:600; cursor:pointer; user-select:none;}
  .choice.active{border-color:var(--hivis); color:var(--hivis-text); background:var(--hivis-dim); box-shadow:0 4px 14px var(--hivis-glow);}
  .switch{position:relative; display:inline-block; width:51px; height:31px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .switch-slider{position:absolute; cursor:pointer; inset:0; background:var(--asphalt-4); transition:.2s; border-radius:31px;}
  .switch-slider:before{content:""; position:absolute; height:27px; width:27px; left:2px; top:2px; background:#fff; transition:.2s; border-radius:50%; box-shadow:0 2px 4px rgba(0,0,0,.3);}
  .switch input:checked + .switch-slider{background:#34C759;}
  .switch input:checked + .switch-slider:before{transform:translateX(20px);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .divider-or{display:flex; align-items:center; gap:10px; margin:20px 0; color:var(--mist-dim);
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em;}
  .divider-or::before,.divider-or::after{content:''; flex:1; height:1px; background:var(--asphalt-3);}

  .btn{border:none; border-radius:999px; padding:15px 22px; font-weight:700; font-size:15px; cursor:pointer;
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary{background:var(--hivis); color:var(--ink); box-shadow:0 10px 24px var(--hivis-glow); transition:transform .12s ease, box-shadow .12s ease;}
  .btn-primary:active{transform:scale(.98); box-shadow:0 4px 12px var(--hivis-glow);}
  .btn-outline{background:var(--asphalt-2); border:1.5px solid var(--overlay-hairline); color:var(--chalk); box-shadow:var(--shadow-card); transition:transform .12s ease, background .12s ease;}
  .btn-outline:active{transform:scale(.97); background:var(--press);}
  .btn-saved-flash{background:var(--hivis) !important; border-color:var(--hivis) !important; color:var(--ink) !important; transition:background .15s ease, color .15s ease;}
  .btn-danger{background:var(--danger-dim); color:var(--danger);}
  .btn-sm{padding:10px 16px; font-size:13.5px; width:auto;}
  .btn-disabled{background:var(--asphalt-2); color:var(--mist-dim); border:1.5px solid var(--asphalt-4);
    cursor:not-allowed; position:relative; margin-top:10px;}
  .soon-tag{position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:9px;
    text-transform:uppercase; letter-spacing:.05em; background:var(--asphalt-3); padding:3px 7px; border-radius:6px;}
  .soon-note{font-size:12px; color:var(--mist-dim); text-align:center; margin-top:10px; line-height:1.5;}
  .err-text{color:var(--danger); font-size:12.5px; margin-top:8px; display:none;}

  header.top{padding:calc(16px + var(--safe-top)) 20px 14px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5; background:linear-gradient(180deg, var(--tabbar-bg) 55%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);}
  header.top .brand{display:flex; align-items:center; gap:9px;}
  header.top .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--hivis); box-shadow:0 0 10px var(--hivis);}
  header.top .brand span{font-size:15px; font-weight:800; letter-spacing:.02em;}

  .view{display:none; padding:4px 20px 128px;}
  .view.active{display:block; animation:viewFadeIn .22s ease;}
  @keyframes viewFadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  /* #view-coach usa una animación sin transform (solo opacity): un transform en este
     elemento crearía un "containing block" nuevo para su hijo #coachChatWrap
     (position:fixed), y durante los .22s de la animación el chat quedaría mal
     posicionado (relativo a esta sección en vez de a la pantalla). */
  #view-coach.active{animation:viewFadeInOpacity .22s ease;}
  @keyframes viewFadeInOpacity{from{opacity:0;} to{opacity:1;}}

  .card{background:linear-gradient(180deg, var(--asphalt-2), var(--asphalt-2)); border-radius:var(--radius); padding:22px; margin-bottom:16px; border:1px solid var(--overlay-hairline); box-shadow:var(--shadow-card);}
  /* Nada de alpha acá: las tarjetas tipo "swipe to delete" (history, zapatillas)
     ponen esta misma clase .card ARRIBA de un fondo rojo de "borrar" -- un
     segundo color con transparencia dejaba traslucir ese rojo por debajo,
     incluso en reposo. El highlight de "elevada" se logra solo con el inset,
     que no afecta la opacidad del fondo. */
  :root:not([data-theme="light"]) .card{background:var(--asphalt-2); box-shadow:var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.03);}
  /* En modo claro el track del switch (asphalt-4) queda bastante cerca del blanco de
     la tarjeta -- un borde chico ayuda a que se note el "apagado" como un control,
     no solo como un rectángulo de fondo. */
  :root[data-theme="light"] .switch-slider{border:1px solid rgba(0,0,0,.10);}
  /* Mismo motivo: el borde "hairline" casi no se ve en claro sobre una tarjeta
     blanca, y btn-outline necesita leerse como botón tocable, no como una tarjeta
     más. Le damos un borde más marcado (asphalt-4) solo en modo claro. */
  :root[data-theme="light"] .btn-outline{border-color:var(--asphalt-4);}
  .card[onclick]{cursor:pointer; transition:transform .12s ease;}
  .card[onclick]:active{transform:scale(.98);}
  .card h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--mist); font-weight:700; margin-bottom:12px;}
  .muted{color:var(--mist); font-size:13.5px; line-height:1.5; white-space:pre-line;}

  .streak-badge{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:800; padding:6px 12px; border-radius:999px;
    background:var(--hivis-dim); color:var(--hivis-text); white-space:nowrap; flex-shrink:0;}

  .tag{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:5px 10px; border-radius:999px;}
  .tag-asfalto{background:var(--asphalt-4); color:var(--chalk);}
  .tag-trail{background:var(--clay-dim); color:var(--clay);}
  .tag-mixto{background:var(--hivis-dim); color:var(--hivis-text);}
  .tag-soon{background:var(--asphalt-3); color:var(--mist-dim); border:1px dashed var(--asphalt-4);}
  .tag-load-caution{background:var(--clay-dim); color:var(--clay);}
  .tag-load-risk{background:var(--danger-dim); color:var(--danger);}

  .zone-chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;}
  .zone-1{background:var(--zone1-bg); color:var(--zone1);}
  .zone-2{background:var(--zone2-bg); color:var(--zone2);}
  .zone-3{background:var(--zone3-bg); color:var(--zone3);}
  .zone-4{background:var(--zone4-bg); color:var(--zone4);}
  .zone-5{background:var(--zone5-bg); color:var(--zone5);}
  .zone-badge-live{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-radius:var(--radius-sm); margin-bottom:12px; background:var(--asphalt-2);}
  .zone-badge-live.zone-1{background:var(--zone1-bg-live);}
  .zone-badge-live.zone-2{background:var(--zone2-bg-live);}
  .zone-badge-live.zone-3{background:var(--zone3-bg-live);}
  .zone-badge-live.zone-4{background:var(--zone4-bg-live);}
  .zone-badge-live.zone-5{background:var(--zone5-bg-live);}
  .zone-badge-live .zn{font-size:19px; font-weight:800;}

  .greeting{font-size:25px; font-weight:600; margin:14px 0 4px; letter-spacing:-.01em;}
  .next-session{display:flex; justify-content:space-between; align-items:flex-start;}
  .next-session .big{font-size:42px; line-height:.95;}
  .stat-row{display:flex; gap:10px;}
  .stat-box{flex:1; background:var(--asphalt-3); border-radius:var(--radius-sm); padding:13px 10px; text-align:center; border:1px solid var(--overlay-hairline); box-shadow:0 2px 8px rgba(0,0,0,.14);}
  .stat-box .n{font-size:21px; font-weight:800;}
  .hist-card .stat-box .n{font-size:16px;}
  .hist-map{position:relative; isolation:isolate; height:108px; border-radius:var(--radius-sm); overflow:hidden; margin-bottom:10px; background:var(--asphalt-3);}
  .hist-map:empty{background:linear-gradient(90deg, var(--asphalt-3) 25%, var(--asphalt-4) 37%, var(--asphalt-3) 63%); background-size:400% 100%; animation:skeletonShine 1.4s ease infinite;}
  .stat-box .l{font-size:10px; color:var(--mist); text-transform:uppercase; letter-spacing:.05em;}
  .week-bars{display:flex; align-items:flex-end; gap:6px; height:70px; margin-top:14px;}
  .week-bars .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .week-bars .bar{width:100%; border-radius:7px 7px 3px 3px; background:var(--asphalt-4); transition:height .5s cubic-bezier(.22,1,.36,1);}
  .week-bars .bar.rest-day{background:transparent; border:1px dashed var(--asphalt-4); height:4px !important;}
  .week-bars .bar.planned-day{background:transparent; border:1.5px dashed var(--mist-dim);}
  .week-bars .bar.hivis{background:var(--hivis); box-shadow:0 3px 12px var(--hivis-glow);}
  .week-bars .lbl{font-size:9.5px; color:var(--mist); margin-top:6px;}
  .coach-snippet{display:flex; gap:12px; align-items:flex-start;}
  .coach-avatar{width:40px; height:40px; border-radius:14px; background:var(--hivis-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  .day-row{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--asphalt-3); cursor:pointer; transition:background .12s ease;}
  .day-row:active{background:var(--press);}
  .day-row:last-child{border-bottom:none;}
  .day-badge{width:42px; text-align:center; flex-shrink:0;}
  .day-badge .d{font-size:11px; color:var(--mist); text-transform:uppercase;}
  .day-info{flex:1; min-width:0;}
  .day-info .t{font-weight:700; font-size:14px;}
  .day-info .m{font-size:12px; color:var(--mist); margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .day-dist{font-family:'JetBrains Mono',monospace; font-size:14.5px; font-weight:700; color:var(--hivis-text); flex-shrink:0;}
  .day-detail{display:none; padding:0 0 14px 54px; font-size:13px; color:var(--mist); line-height:1.7; white-space:pre-line;}
  .day-detail.open{display:block;}

  #runIdle{text-align:center; padding-top:16px;}
  .go-circle{width:100%; max-width:280px; height:120px; border-radius:var(--radius); margin:22px auto; background:var(--hivis);
    display:flex; align-items:center; justify-content:center; flex-direction:column; color:var(--ink); border:none; cursor:pointer;
    box-shadow:0 14px 34px var(--hivis-glow);}
  .go-circle .display{font-size:29px;}
  .go-circle:active{transform:scale(.97);}
  #runActive,#runSummary{display:none;}
  .rec-dot{width:9px; height:9px; border-radius:50%; background:var(--danger); animation:blink 1.4s ease-in-out infinite; display:inline-block; margin-right:7px;}
  .timer-big{font-size:48px; text-align:center; margin:10px 0 14px;}
  .map-wrap{position:relative; isolation:isolate; height:260px; border-radius:var(--radius); overflow:hidden; margin-bottom:14px; border:1px solid var(--asphalt-4);
    background:linear-gradient(90deg, var(--asphalt-3) 25%, var(--asphalt-4) 37%, var(--asphalt-3) 63%); background-size:400% 100%; animation:skeletonShine 1.4s ease infinite;}
  #liveMap{height:100%; width:100%; background:var(--asphalt-3);}
  .map-wrap .leaflet-control-attribution{background:rgba(18,20,21,.75); color:var(--mist-dim); font-size:9px; padding:1px 5px;}
  .map-wrap .leaflet-control-attribution a{color:var(--mist);}
  .map-recenter-btn{position:absolute; bottom:12px; right:12px; z-index:10; width:40px; height:40px; border-radius:50%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--hivis-text); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .run-controls{display:flex; gap:10px; margin-top:16px;}

  /* ---- Contenedor del chat: alto real medido por JS (syncCoachChatLayout), no CSS
     adivinado -- ver ese comentario largo junto a la función en el <script> para el
     porqué. #coachChatWrap ocupa desde abajo del header hasta arriba de la tabbar
     (o hasta el borde del teclado cuando está abierto), y adentro es un flex column:
     título -> #chatLog (el único que scrollea, flex:1) -> barra de escribir (último
     hijo, en flujo normal -- ya no "position:fixed" independiente, así que nunca
     puede quedar mal calculada ni moverse sola al hacer scroll del chat). */
  #coachChatWrap{position:fixed; left:0; right:0; max-width:480px; margin:0 auto; top:64px; bottom:78px;
    display:flex; flex-direction:column; z-index:15; background:var(--asphalt);}
  #coachChatTitle{font-size:25px; margin:0; padding:14px 20px 0; flex-shrink:0;}
  .coach-disclaimer{flex-shrink:0; margin:0; padding:4px 20px 10px; font-size:11px; color:var(--mist-dim); line-height:1.4;}
  #chatLog{display:flex; flex-direction:column; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 20px 10px; overscroll-behavior:contain;}
  .msg{max-width:82%; padding:11px 14px; border-radius:16px; font-size:14px; line-height:1.5; margin-bottom:10px;}
  .msg.first,.msg.mid{margin-bottom:2px;}
  .msg.coach{background:var(--asphalt-2); align-self:flex-start; border-bottom-left-radius:4px; white-space:pre-wrap;}
  .msg.user{background:var(--hivis); color:var(--ink); align-self:flex-end; border-bottom-right-radius:4px; font-weight:600;}
  .msg.system{align-self:center; background:none; color:var(--hivis-text); font-size:11.5px; text-align:center; max-width:100%; font-weight:700; margin-bottom:10px;}
  .msg.coach.mid,.msg.coach.last{border-top-left-radius:6px;}
  .msg.coach.first,.msg.coach.mid{border-bottom-left-radius:6px;}
  .msg.user.mid,.msg.user.last{border-top-right-radius:6px;}
  .msg.user.first,.msg.user.mid{border-bottom-right-radius:6px;}
  .msg-time{display:flex; font-size:10.5px; color:var(--mist-dim); margin:-4px 0 10px; padding:0 4px;}
  .msg-time.left{justify-content:flex-start; padding-left:14px;}
  .msg-time.right{justify-content:flex-end; padding-right:14px;}
  .typing span{display:inline-block; width:6px; height:6px; background:var(--mist); border-radius:50%; margin-right:3px; animation:blink 1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  .chat-input-bar{flex-shrink:0; background:var(--asphalt);
    padding:10px 16px; display:none; align-items:center; gap:8px; border-top:1px solid var(--asphalt-3);}
  .chat-input-bar.active{display:flex;}
  .chat-input-bar input{flex:1; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--chalk); padding:13px 16px; border-radius:999px; font-size:15px; outline:none;}
  .chat-input-bar input:focus{border-color:var(--hivis);}
  .chat-send{background:var(--hivis); color:var(--ink); border:none; width:44px; height:44px; border-radius:50%; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s ease, background .15s ease;}
  .chat-send:active{transform:scale(.92);}
  .chat-send[data-busy="1"]{background:var(--asphalt-4); color:var(--chalk);}
  .chat-chips{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 16px;}
  .chat-chip{background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--mist); font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:999px; cursor:pointer; transition:border-color .12s ease, color .12s ease, transform .1s ease;}
  .chat-chip:active{transform:scale(.95); border-color:var(--hivis); color:var(--hivis-text);}
  .msg .msg-list{margin:6px 0; padding-left:18px;}
  .msg .msg-list li{margin-bottom:3px;}
  /* position:absolute relativo a #coachChatWrap (que es el positioning context) --
     JS ajusta "bottom" según el alto real de la barra de escribir. */
  .chat-scroll-btn-wrap{position:absolute; left:0; right:0; bottom:86px; pointer-events:none; z-index:2;}
  .chat-scroll-btn{position:absolute; right:16px; bottom:0; width:38px; height:38px; border-radius:50%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--hivis-text); display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto; box-shadow:0 3px 12px rgba(0,0,0,.35); transition:transform .12s ease;}
  .chat-scroll-btn:active{transform:scale(.9);}

  .day-picker{display:flex; flex-wrap:wrap; gap:8px;}
  .day-pill{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--asphalt-4); background:var(--asphalt-2); color:var(--mist); font-size:11px; font-weight:700; cursor:pointer; user-select:none; flex-shrink:0;}
  .day-pill.active{border-color:var(--hivis); color:var(--hivis-text); background:var(--hivis-dim); box-shadow:0 4px 14px var(--hivis-glow);}

  .hist-card{margin-bottom:12px;}
  .type-breakdown-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .type-breakdown-row:last-child{margin-bottom:0;}
  .type-breakdown-label{width:92px; flex-shrink:0; font-size:12.5px; color:var(--mist); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .type-breakdown-bar-wrap{flex:1; height:8px; background:var(--asphalt-3); border-radius:99px; overflow:hidden;}
  .type-breakdown-bar{height:100%; background:var(--hivis); border-radius:99px;}
  .type-breakdown-count{width:18px; text-align:right; font-size:12.5px; font-weight:700; color:var(--chalk); flex-shrink:0;}
  .swipe-item{position:relative; overflow:hidden;}
  #history-list .swipe-item{border-radius:var(--radius); margin-bottom:12px;}
  #history-list .swipe-item .hist-card{margin-bottom:0;}
  .swipe-action-delete{position:absolute; top:0; right:0; bottom:0; width:78px; background:var(--danger);
    color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  /* #history-list: acá el fondo rojo NO pinta directo sobre el rectángulo del botón
     (que sigue siendo el área completa, para no achicar el tap target) -- pinta en un
     ::before, separado unos px de las esquinas redondeadas de la tarjeta de arriba.
     Con las dos formas coincidiendo exactamente en la esquina, quedaba asomando un
     hilito de rojo sin antialiasear ahí (bug clásico de recortes redondeados
     superpuestos) -- separándolo unos píxeles, el rojo nunca llega a esa zona. */
  #history-list .swipe-action-delete{background:none;}
  #history-list .swipe-action-delete::before{content:''; position:absolute; top:4px; right:4px; bottom:4px; left:0;
    background:var(--danger); border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
  #history-list .swipe-action-delete .icon-sq{position:relative;}
  .swipe-content{position:relative; touch-action:pan-y; will-change:transform; backface-visibility:hidden;}
  .swipe-content.swipe-anim{transition:transform .25s cubic-bezier(.22,1,.36,1);}
  .shoe-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--asphalt-3);}
  .shoe-row:last-child, #shoe-list > .shoe-item:last-child{border-bottom:none;}
  .shoe-row .swipe-item{flex:1; min-width:0;}
  .shoe-row .swipe-content{background:var(--asphalt-2); display:flex; align-items:center; gap:10px;}
  .shoe-row .shoe-info{min-width:0;}
  .shoe-row .shoe-info .n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hist-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .hist-date{font-size:12px; color:var(--mist);}
  .hist-route{width:100%; height:104px; background:var(--asphalt-3); border-radius:var(--radius-sm); margin:10px 0;}
  .hist-hrlist{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}

  .profile-head{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
  .avatar-big{width:56px; height:56px; border-radius:18px; background:var(--hivis-dim); color:var(--hivis-text); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:21px; flex-shrink:0; position:relative; overflow:hidden; cursor:pointer;}
  .avatar-big img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .avatar-edit-badge{position:absolute; bottom:-2px; right:-2px; width:20px; height:20px; border-radius:50%; background:var(--hivis); color:var(--ink); display:flex; align-items:center; justify-content:center; border:2px solid var(--asphalt); pointer-events:none;}
  .pr-medal-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:4px;}
  .pr-medal{display:flex; flex-direction:column; align-items:center; gap:5px; padding:14px 6px; border-radius:var(--radius-sm); background:var(--asphalt-3); text-align:center; transition:background .15s ease;}
  .pr-medal.achieved{background:var(--hivis-dim);}
  .pr-medal .icon-sq{width:24px; height:24px; color:var(--mist-dim);}
  .pr-medal.achieved .icon-sq{color:var(--hivis-text);}
  .pr-medal-label{font-size:11.5px; font-weight:800; color:var(--mist);}
  .pr-medal.achieved .pr-medal-label{color:var(--chalk);}
  .pr-medal-time{font-size:12px; font-weight:800; font-family:'JetBrains Mono',monospace; color:var(--hivis-text);}
  .pr-medal-locked{font-size:11px; color:var(--mist-dim);}
  .shoe-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--asphalt-3); transition:background .12s ease;}
  .shoe-item:active{background:var(--press);}
  .shoe-icon{width:36px; height:36px; border-radius:11px; background:var(--asphalt-3); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--mist);}
  .shoe-icon svg{width:19px; height:19px;}
  .shoe-info{flex:1;}
  .shoe-info .n{font-weight:700; font-size:13.5px;}
  .wearbar{height:6px; background:var(--asphalt-3); border-radius:99px; margin-top:6px; overflow:hidden;}
  .wearbar > div{height:100%; background:var(--hivis);}
  .wearbar.warn > div{background:var(--danger);}
  .conn-item{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--asphalt-3); transition:background .12s ease;}
  .conn-item:active{background:var(--press);}
  .conn-item:last-child{border-bottom:none;}
  .conn-item .n{font-size:13.5px; font-weight:600;}
  .zone-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--asphalt-3);}
  .zone-row:last-child{border-bottom:none;}
  .zone-row .zd{font-size:11px; color:var(--mist-dim); margin-top:2px;}
  .small-link{color:var(--mist); font-size:12.5px; text-decoration:underline; background:none; border:none; cursor:pointer; padding:0; transition:opacity .12s ease;}
  .info-btn{background:none; border:none; color:var(--mist-dim); cursor:pointer; padding:4px; margin:-4px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:color .12s ease, transform .12s ease;}
  .info-btn:active{transform:scale(.85); color:var(--hivis-text);}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:44px !important;}
  .pw-toggle{position:absolute; right:2px; top:0; bottom:0; margin:auto; height:fit-content; background:none; border:none; color:var(--mist-dim); cursor:pointer; padding:10px; display:flex; align-items:center; justify-content:center;}
  .pw-toggle:active{color:var(--hivis-text);}
  .small-link:active{opacity:.55;}
  .week-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;}
  .week-nav-label{margin:0; text-align:center; color:var(--mist); font-size:13px; font-weight:700; flex:1; letter-spacing:.01em;}
  .week-nav-btn{width:32px; height:32px; border-radius:50%; background:var(--asphalt-3); border:none; color:var(--chalk);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0;
    transition:transform .12s ease, background .12s ease, opacity .15s ease;}
  .week-nav-btn:active{transform:scale(.85); background:var(--asphalt-4);}
  .week-nav-btn:disabled{opacity:.25; pointer-events:none;}
  .plan-slide-left{animation:planSlideLeft .22s ease;}
  .plan-slide-right{animation:planSlideRight .22s ease;}
  @keyframes planSlideLeft{from{opacity:0; transform:translateX(14px);} to{opacity:1; transform:translateX(0);}}
  @keyframes planSlideRight{from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:translateX(0);}}
  .icon-sq{display:inline-flex; flex-shrink:0;}
  .icon-sq svg{width:100%; height:100%; display:block;}
  .spin-icon{animation:spinIcon .8s linear infinite;}
  @keyframes spinIcon{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}

  .skeleton{background:linear-gradient(90deg, var(--asphalt-3) 25%, var(--asphalt-4) 37%, var(--asphalt-3) 63%);
    background-size:400% 100%; animation:skeletonShine 1.4s ease infinite; border-radius:8px;}
  @keyframes skeletonShine{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}
  .add-row{display:flex; gap:8px; margin-top:12px;}
  .add-row input,.add-row select{flex:1; background:var(--asphalt-3); border:1.5px solid var(--asphalt-4); color:var(--chalk); padding:11px; border-radius:var(--radius-sm); font-size:14px;}

  nav.tabbar{position:fixed; bottom:14px; left:14px; right:14px; max-width:452px; margin:0 auto; background:var(--tabbar-bg);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); display:flex; padding:9px 6px calc(9px + var(--safe-bottom));
    border-radius:26px; border:1px solid var(--overlay-hairline); box-shadow:var(--shadow-lg); z-index:20;}
  nav.tabbar button{flex:1; background:none; border:none; color:var(--mist-dim); display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:600; cursor:pointer; padding:4px 2px; transition:transform .12s ease, color .12s ease;}
  .nav-icon-wrap{position:relative; display:inline-flex;}
  .nav-badge-dot{position:absolute; top:-2px; right:-4px; width:8px; height:8px; border-radius:50%; background:var(--hivis); border:1.5px solid var(--asphalt); display:none;}
  nav.tabbar button svg{width:22px; height:22px; padding:3px; box-sizing:content-box; border-radius:10px; transition:background .15s ease;}
  nav.tabbar button.active{color:var(--hivis-text);}
  nav.tabbar button.active svg{background:var(--hivis-dim);}
  nav.tabbar button:active{transform:scale(.9);}

  .elev-divider{display:flex; align-items:center; gap:8px; margin:22px 0 14px; color:var(--mist-dim);}
  .elev-divider svg{width:60px; height:14px; flex-shrink:0;}
  .elev-divider span{font-size:11px; text-transform:uppercase; letter-spacing:.07em;}
  .elev-divider::after{content:''; flex:1; height:1px; background:var(--asphalt-3);}
</style>
</head>
<body>
<div id="app">

  <div id="offline-banner"><span class="icon-sq" style="width:14px; height:14px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.5a10 10 0 0 1 5-2.7"/><path d="M19 12.5a10 10 0 0 0-2.3-1.9"/><path d="M2 8.5a15 15 0 0 1 4.2-2.8"/><path d="M22 8.5a15 15 0 0 0-9-4.4"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg></span><span data-i18n="offline_banner"></span></div>

  <div id="splash">
    <div class="pulse-strip"><svg viewBox="0 0 300 40" preserveAspectRatio="none"><path d="M0 20 H40 L48 6 L58 34 L66 20 H90 L98 8 L108 32 L116 20 H150 H190 L198 6 L208 34 L216 20 H240 L248 8 L258 32 L266 20 H300 L308 6 L318 34 L326 20 H350 H390 L398 6 L408 34 L416 20 H440 L448 8 L458 32 L466 20 H500 L508 6 L518 34 L526 20 H600" fill="none" stroke="#D6FF3F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
    <h1 class="display word">ZANC<span>A</span>DA</h1>
    <p class="tag" data-i18n="app_tag"></p>
    <div class="splash-mid">
      <div class="splash-features">
        <div class="splash-feature">
          <span class="icon-sq" style="width:22px; height:22px; color:var(--hivis-text); flex-shrink:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>
          <div><strong data-i18n="splash_feat1_title"></strong><p data-i18n="splash_feat1_desc"></p></div>
        </div>
        <div class="splash-feature">
          <span class="icon-sq" style="width:22px; height:22px; color:var(--hivis-text); flex-shrink:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5h16v11H8l-4 4v-4H4z"/></svg></span>
          <div><strong data-i18n="splash_feat2_title"></strong><p data-i18n="splash_feat2_desc"></p></div>
        </div>
        <div class="splash-feature">
          <span class="icon-sq" style="width:22px; height:22px; color:var(--hivis-text); flex-shrink:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span>
          <div><strong data-i18n="splash_feat3_title"></strong><p data-i18n="splash_feat3_desc"></p></div>
        </div>
      </div>
    </div>

    <div style="width:100%; max-width:280px; flex-shrink:0; margin-bottom:48px;">
      <button class="btn btn-primary" data-i18n="start" onclick="goLogin()"></button>
    </div>
  </div>

  <div class="overlay" id="login">
    <h2 class="display" data-i18n="login_title"></h2>
    <p class="lead" data-i18n="login_lead_signin"></p>
    <div class="field">
      <label data-i18n="login_email_label"></label>
      <input type="email" id="login-email" autocomplete="email" data-i18n-ph="login_email_ph" onkeydown="if(event.key==='Enter') handleSignIn();">
    </div>
    <div class="field">
      <label data-i18n="login_password_label"></label>

          <option value="5k" data-i18n="ob_goal_5k"></option>
          <option value="10k" data-i18n="ob_goal_10k"></option>
          <option value="15k" data-i18n="ob_goal_15k"></option>
          <option value="21k" data-i18n="ob_goal_21k"></option>
          <option value="42k" data-i18n="ob_goal_42k"></option>
          <option value="ultra" data-i18n="ob_goal_ultra"></option>
          <option value="lifestyle" data-i18n="ob_goal_lifestyle"></option>
        </select>
        <div id="perfil-goal-km-check" style="display:none; margin-top:14px;">
          <label data-i18n="ob_currentkm_label"></label>
          <input type="number" id="perfil-current-km-check" placeholder="20" min="0" max="200">
          <p class="muted" style="margin-top:6px; font-size:12px;" data-i18n="perfil_goal_km_check_hint"></p>
        </div>
        <label style="margin-top:14px;" data-i18n="ob_racedate_label"></label>
        <div class="date-box" onclick="openCalendar('perfil-racedate','perfil-racedate-text')"><span class="date-box-text placeholder" id="perfil-racedate-text"></span></div>
        <input type="hidden" id="perfil-racedate">
        <p class="muted" style="margin-top:6px;" data-i18n="ob_racedate_hint"></p>
      </div>
      <p class="muted" style="margin-top:10px; font-size:12.5px;" data-i18n="perfil_weeklykm_auto_note"></p>
      <button class="btn btn-outline btn-sm" id="save-personal-btn" style="margin-top:10px; width:100%;" data-i18n="save_word" onclick="savePersonalData()"></button>
    </div>

    <div class="card">
      <h3 data-i18n="perfil_goals_title"></h3>
      <p class="muted" style="margin-bottom:10px;" data-i18n="perfil_goals_desc"></p>
      <div class="field" style="margin-top:0;">
        <label data-i18n="perfil_weekly_goal_label"></label>
        <input type="number" id="perfil-weekly-goal" data-i18n-ph="perfil_weekly_goal_ph">
      </div>
      <div class="field">
        <label data-i18n="perfil_goal_note_label"></label>
        <textarea id="perfil-goal-note" rows="3" data-i18n-ph="perfil_goal_note_ph" style="width:100%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--chalk); padding:12px; border-radius:var(--radius-sm); font-size:14px; font-family:inherit; resize:vertical;"></textarea>
      </div>
      <button class="btn btn-outline btn-sm" id="save-goals-btn" style="margin-top:10px; width:100%;" data-i18n="save_word" onclick="saveGoals()"></button>
    </div>

    <div class="card">
      <h3 data-i18n="perfil_days_title"></h3>
      <div class="day-picker" id="perfil-days"></div>
      <button class="btn btn-outline btn-sm" id="save-days-btn" style="margin-top:12px; width:100%;" data-i18n="perfil_days_save" onclick="saveTrainingDays()"></button>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <h3 data-i18n="perfil_zones_title" style="margin:0;"></h3>
        <button class="info-btn" onclick="openZonesInfo()" data-i18n-aria="aria_zones_info"><span class="icon-sq" style="width:19px; height:19px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/></svg></span></button>
      </div>
      <p class="muted" id="zones-status" data-i18n="perfil_zones_manual_note"></p>
      <div id="zones-list" style="margin-top:8px;"></div>
      <button class="btn btn-outline btn-sm" id="save-zones-btn" style="margin-top:12px; width:100%;" data-i18n="save_word" onclick="saveCustomZones()"></button>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:2px;">
        <h3 style="margin:0;" data-i18n="pain_list_title"></h3>
        <button onclick="openPainInfo()" style="background:none; border:1.5px solid var(--mist-dim); color:var(--mist-dim); width:19px; height:19px; border-radius:50%; font-size:11px; font-weight:800; font-style:italic; font-family:Georgia,serif; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; flex-shrink:0; line-height:1;">i</button>
      </div>
      <div id="pain-log-list"></div>
      <button class="btn btn-outline btn-sm" style="margin-top:12px; width:100%;" data-i18n="pain_add_btn" onclick="openPainModal()"></button>
    </div>

    <div class="card">
      <h3 data-i18n="perfil_gear"></h3>
      <div id="shoe-list"></div>
      <div class="add-row">
        <input type="text" id="shoe-name" data-i18n-ph="perfil_shoe_ph">
        <select id="shoe-terrain">
          <option value="asfalto" data-i18n="ob_terrain_asfalto"></option>
          <option value="trail" data-i18n="ob_terrain_trail"></option>
          <option value="mixto" data-i18n="ob_terrain_mixto"></option>
        </select>
      </div>
      <button class="btn btn-outline btn-sm" style="margin-top:10px; width:100%;" data-i18n="perfil_add_shoe" onclick="addShoe()"></button>
    </div>

    <div class="card">
      <h3 data-i18n="perfil_event"></h3>
      <div id="event-box"></div>
      <div class="add-row" style="margin-top:10px;"><input type="text" id="ev-name" data-i18n-ph="perfil_ev_name_ph"></div>
      <div class="add-row" style="margin-top:8px;"><input type="number" id="ev-distance" step="0.1" min="0" data-i18n-ph="perfil_ev_dist_ph"></div>
      <div class="add-row" style="margin-top:8px;">
        <div class="date-box" style="flex:1;" onclick="openCalendar('ev-date','ev-date-text')"><span class="date-box-text" id="ev-date-text"></span></div>
        <input type="hidden" id="ev-date">
        <select id="ev-type">
          <option value="ruta" data-i18n="ev_type_ruta"></option>
          <option value="trail" data-i18n="ev_type_trail"></option>
          <option value="obstaculos" data-i18n="ev_type_obstaculos"></option>
        </select>
      </div>
      <button class="btn btn-outline btn-sm" style="margin-top:10px; width:100%;" data-i18n="perfil_ev_save" onclick="setEvent()"></button>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="flex:1; padding-right:12px;">
          <h3 style="margin-bottom:2px;" data-i18n="perfil_push_title"></h3>
          <p class="muted" id="push-status" style="font-size:12.5px;" data-i18n="push_disabled"></p>
        </div>
        <label class="switch">
          <input type="checkbox" id="push-toggle" onchange="handlePushToggle(this.checked)">
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="flex:1; padding-right:12px;">
          <h3 style="margin-bottom:2px;" data-i18n="perfil_theme_title"></h3>
          <p class="muted" id="theme-status" style="font-size:12.5px;" data-i18n="perfil_theme_dark"></p>
        </div>
        <label class="switch">
          <input type="checkbox" id="theme-toggle" onchange="handleThemeToggle(this.checked)">
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="perfil_lang"></h3>
      <div class="choice-row" id="perfil-lang-choice" style="flex-wrap:wrap;">
        <div class="choice" data-v="es">Español</div>
        <div class="choice" data-v="en">English</div>
        <div class="choice" data-v="pt">Português</div>
        <div class="choice" data-v="fr">Français</div>
        <div class="choice" data-v="it">Italiano</div>
        <div class="choice" data-v="de">Deutsch</div>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="perfil_units"></h3>
      <div class="choice-row" id="units-toggle">
        <div class="choice active" data-v="metric" data-i18n="perfil_units_metric"></div>
        <div class="choice" data-v="imperial" data-i18n="perfil_units_imperial"></div>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="perfil_voice_label"></h3>
      <div class="choice-row" id="voice-toggle">
        <div class="choice active" data-v="on" data-i18n="word_yes"></div>
        <div class="choice" data-v="off" data-i18n="word_no"></div>
      </div>
    </div>

    <div class="elev-divider"><svg viewBox="0 0 60 14"><polyline points="0,12 10,12 16,4 22,10 28,2 34,9 40,12 60,12" fill="none" stroke="#C06A2E" stroke-width="1.6"/></svg><span data-i18n="perfil_connectivity"></span></div>
    <div class="card">
      <p class="muted" style="margin-bottom:8px;" data-i18n="perfil_connectivity_desc"></p>
      <div class="conn-item"><span class="n">Strava</span><span id="strava-status" class="tag tag-soon" data-i18n="perfil_native"></span></div>
      <button class="btn btn-outline btn-sm" id="strava-connect-btn" style="margin-top:10px; width:100%;" onclick="connectStrava()"></button>
      <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--asphalt-3);">
        <p style="font-weight:700; margin-bottom:8px;" data-i18n="perfil_remember_title"></p>
        <ul style="margin:0; padding-left:18px; color:var(--mist); font-size:13px; line-height:1.7;">
          <li data-i18n="perfil_remember_1"></li>
          <li data-i18n="perfil_remember_2"></li>
          <li data-i18n="perfil_remember_3"></li>
          <li data-i18n="perfil_remember_4"></li>
          <li data-i18n="perfil_remember_5"></li>
          <li data-i18n="perfil_remember_6"></li>
        </ul>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="perfil_about"></h3>
      <p class="muted" id="credits-text"></p>
      <p class="muted" style="margin-top:8px;" data-i18n="perfil_data_note"></p>
      <div style="display:flex; gap:16px; margin-top:12px; flex-wrap:wrap;">
        <a class="small-link" href="/privacy.html" target="_blank" rel="noopener" data-i18n="legal_privacy_link"></a>
        <a class="small-link" href="/terms.html" target="_blank" rel="noopener" data-i18n="legal_terms_link"></a>
        <a class="small-link" href="mailto:info@zancada.org" data-i18n="perfil_support_link"></a>
      </div>
      <div style="display:flex; gap:16px; margin-top:12px;">
        <button class="small-link" onclick="logout()" data-i18n="perfil_logout"></button>
        <button class="small-link" onclick="resetApp()" data-i18n="perfil_reset"></button>
      </div>
      <div style="margin-top:12px;">
        <button class="small-link" style="color:var(--danger);" onclick="deleteAccount()" data-i18n="perfil_delete_account"></button>
      </div>
    </div>
  </section>
